# club-aio web 容器(edge proxy 之後的內層):serve SPA + 反代 /api
# 本檔掛載到 /etc/nginx/conf.d/default.conf(conf.d 位於 http context)

# 登入爆破防護(edge 只有地理白名單,速率限制在這層做)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上傳上限:最大單檔 200MB(維修影片),留裕度
    client_max_body_size 256m;

    # 安全標頭(edge 已有基本組,這裡補 SPA 的 CSP)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'" always;

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api {
        proxy_pass http://backend:8000;
        include /etc/nginx/proxy_headers.conf;
        # 大檔上傳直通後端串流寫盤,不在此緩衝整包
        proxy_request_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # 靜態資產長快取(檔名帶 hash)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
