  const rows=state.violations.length?state.violations.slice().reverse().map(v=>`<tr><td>#${v.id}</td><td>${esc(v.club)}</td><td>${v.date}</td><td style="font-size:12px">${violText(v)}</td><td>${esc(v.location)}</td><td>${esc(v.filler)}</td><td>${v.evidence?`<button class="btn ghost xs" onclick="viewEvidence('${esc(v.evidence)}')">檢視</button>`:'—'}</td><td>${violPill(v.status)}${v.note?`<div class="muted" style="font-size:11px">${esc(v.note)}</div>`:''}</td><td><div class="row-actions">${v.status==='未銷案'?`<button class="btn ok sm" onclick="violClear(${v.id})">銷案</button>`:`<button class="btn ghost sm" onclick="violReopen(${v.id})">恢復未銷案</button>`}<button class="btn warn sm" onclick="violDelete(${v.id})">刪除紀錄</button></div></td></tr>`).join(""):`<tr><td colspan="9" class="muted" style="text-align:center">尚無違規紀錄</td></tr>`;
  const byClub={};state.violations.filter(v=>v.status!=='已銷案').forEach(v=>byClub[v.club]=(byClub[v.club]||0)+1);
  const summ=Object.keys(byClub).length?Object.keys(byClub).map(c=>`<tr><td>${esc(c)}</td><td><b style="color:var(--warn)">${byClub[c]}</b> 筆未銷案</td><td>行政成績 −${byClub[c]} 分</td></tr>`).join(""):`<tr><td colspan="3" class="muted" style="text-align:center">目前無未銷案違規</td></tr>`;
  return `<h1 class="page">違規勸導管理</h1><p class="sub">社團完成愛校服務後，可「銷案」（停止扣分）或「刪除紀錄」；未銷案者於社團競賽行政成績每筆扣 1 分</p>
  <div class="note">違規由工讀生填報。社團改善（完成愛校服務）→ 管理員「銷案」或「刪除紀錄」；社團未改善 → 紀錄保留並持續扣分。</div>
  <div class="card" style="overflow:auto"><h2>違規紀錄</h2><table class="tb"><thead><tr><th>#</th><th>社團</th><th>日期</th><th>違規項目</th><th>地點</th><th>填寫人</th><th>事證</th><th>狀態</th><th>處置</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card"><h2>未銷案統計（影響行政成績）</h2><table class="tb"><thead><tr><th>社團</th><th>未銷案筆數</th><th>行政成績影響</th></tr></thead><tbody>${summ}</tbody></table></div>`;
};
function violClear(id){const v=state.violations.find(x=>x.id===id);if(!v)return;const r=prompt("銷案說明（愛校服務內容）：","已完成愛校服務 2 小時");if(r===null)return;v.status="已銷案";v.note=r;audit("違規銷案",v.club+"："+r);toast(`#${id} ${v.club} 違規已銷案`);render();}
function violReopen(id){const v=state.violations.find(x=>x.id===id);if(!v)return;v.status="未銷案";v.note="";toast(`#${id} 已恢復為未銷案`);render();}
function violDelete(id){const v=state.violations.find(x=>x.id===id);if(!v)return;if(typeof confirm==="function"&&!confirm("確定刪除此違規紀錄？刪除後不再列入扣分。"))return;state.violations=state.violations.filter(x=>x.id!==id);audit("刪除違規紀錄",v.club+"／"+v.date);toast("已刪除違規紀錄");render();}
PAGES.club.cviol=()=>{
  const mine=state.violations.filter(v=>v.club===state.club);
  const uncleared=mine.filter(v=>v.status!=='已銷案').length;
  const rows=mine.length?mine.slice().reverse().map(v=>`<tr><td>${v.date}</td><td style="font-size:12px">${violText(v)}</td><td>${esc(v.location)}</td><td>${v.evidence?`<button class="btn ghost xs" onclick="viewEvidence('${esc(v.evidence)}')">檢視</button>`:'—'}</td><td>${violPill(v.status)}${v.note?`<div class="muted" style="font-size:11px">${esc(v.note)}</div>`:''}</td></tr>`).join(""):`<tr><td colspan="5" class="muted" style="text-align:center">目前無違規紀錄，請繼續保持 👍</td></tr>`;
  return `<h1 class="page">違規勸導紀錄</h1><p class="sub">本社團公共活動空間違規勸導紀錄（${esc(state.club)}）</p>
  <div class="note">學生活動中心 公共教室／社辦違規需做愛校服務銷案；未銷案者，於社團競賽行政成績指標內扣分，1 次扣 1 分。</div>
  ${uncleared?`<div class="note"><b>提醒</b>：目前有 <b>${uncleared}</b> 筆未銷案違規，將於社團競賽「行政資料」成績每筆扣 1 分；請完成愛校服務後洽學務處銷案。</div>`:'<div class="note blue">目前沒有未銷案的違規紀錄。</div>'}
  <div class="card" style="overflow:auto"><table class="tb"><thead><tr><th>違規日期</th><th>違規項目</th><th>地點</th><th>事證</th><th>狀態</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};

/* --- 競賽報名管理 + 分組與評審指派（管理員） --- */
let regOpen={}; /* 報名管理：記住各報名項目摺疊面板的展開狀態（跨 render 保留） */
const REG_SCORE_KEY={s1:"ad7",s2:"ad8"}; /* 負責人會議＝ad7、幹訓＝ad8，各 5 分 */
PAGES.admin.areg=()=>{const w=state.regWindow;
  const items=state.signupItems;
  /* 報名項目以卡片管理；場次制項目（如負責人會議）可動態增刪場次 */
  const itemCards=items.map(it=>{
    const sem=it.semester||semesterOf(it.date);
    const tags=`${it.open?'<span class="pill ok" style="font-size:10px">開放中</span>':'<span class="pill no" style="font-size:10px">未開放</span>'}${sem?` <span class="pill info" style="font-size:10px">${esc(sem)}</span>`:''}${it.sessionBased?' <span class="pill purple" style="font-size:10px">場次制</span>':''} <span class="pill ${it.requiresConfirmation?'wait':'ok'}" style="font-size:10px">${it.requiresConfirmation?'需審核確認':'免審核（自動確認）'}</span>`;
    let sessionBlock='';
    if(it.sessionBased){
      const ss=it.sessions||[];
      const sRows=ss.length?ss.map(se=>`<tr><td style="text-align:left">${esc(se.name)}</td><td>${esc(se.date||'—')}</td><td>${se.semester?`<span class="pill info" style="font-size:10px">${esc(se.semester)}</span>`:'—'}</td><td><button class="btn warn xs" onclick="delSession('${it.id}','${se.id}')">刪除</button></td></tr>`).join(""):`<tr><td colspan="4" class="muted" style="text-align:center">尚無場次，請於下方新增</td></tr>`;
      sessionBlock=`<div style="margin-top:8px;overflow:auto"><div class="muted" style="font-size:12px;margin-bottom:4px">場次清單（累計實際參與滿 4 場給 ad7 滿分 5）：</div>
        <table class="tb"><thead><tr><th style="text-align:left">場次名稱</th><th>日期</th><th>學期</th><th>操作</th></tr></thead><tbody>${sRows}</tbody></table>
        <div class="row-actions" style="margin-top:8px"><input type="text" id="ns_name_${it.id}" placeholder="場次名稱（例：上學期期初會議）" style="width:auto"><input type="date" id="ns_date_${it.id}" style="width:auto"><button class="btn primary sm" onclick="addSession('${it.id}')">＋ 新增場次（依日期自動判學期）</button></div></div>`;
    }
    return `<div class="card" style="margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="color:var(--blue)">${esc(it.name)}</b> ${tags}</div>
      ${signupItemInfo(it)?`<div class="muted" style="font-size:12px;margin-top:4px">${signupItemInfo(it)}</div>`:''}${it.note?`<div class="muted" style="font-size:12px">${esc(it.note)}</div>`:''}
      ${sessionBlock}
      <div class="row-actions" style="margin-top:10px"><button class="btn ghost sm" onclick="editSignupItem('${it.id}')">編輯資訊</button><button class="btn ${it.open?'ghost':'ok'} sm" onclick="toggleSignupItem('${it.id}')">${it.open?'關閉報名':'開放報名'}</button><button class="btn ghost sm" onclick="toggleRequiresConfirmation('${it.id}')">${it.requiresConfirmation?'改為免審核':'改為需審核'}</button><button class="btn warn sm" onclick="delSignupItem('${it.id}')">刪除項目</button></div>
    </div>`;
  }).join("");
  /* 依報名項目分組的摺疊面板（accordion）；預設收合，點標題列展開 */
  const panels=items.map(it=>{
    const regs=state.signups.map((s,i)=>({s,i})).filter(o=>o.s.items.includes(it.id));
    const confN=it.sessionBased?regs.filter(o=>attendedCount(it.id,o.s.club)>=4).length:regs.filter(o=>o.s.confirmed&&o.s.confirmed[it.id]).length;
    const sk=REG_SCORE_KEY[it.id];
    const isAward=(it.id==='s3'); /* 社團競賽(評鑑)：顯示報名獎項欄 */
    const rrows=regs.length?regs.map(o=>{
      let confirmCell,scoreCell='<span class="muted">—</span>';
      if(it.sessionBased){
        const ss=it.sessions||[];const cnt=attendedCount(it.id,o.s.club);
        confirmCell=`<div style="display:flex;flex-direction:column;gap:3px">${ss.length?ss.map(se=>`<label style="display:inline-flex;gap:5px;align-items:center;font-size:12px"><input type="checkbox" ${sessionAttended(it.id,o.s.club,se.id)?'checked':''} onchange="toggleSessionAttend('${it.id}','${esc(o.s.club)}','${se.id}')"> ${esc(se.name)}${se.semester?`<span class="muted">（${esc(se.semester)}）</span>`:''}</label>`).join(""):'<span class="muted" style="font-size:12px">尚未建立場次</span>'}<span class="muted" style="font-size:11px">累計出席 <b>${cnt}</b> / 4 場${cnt>=4?' <span class="pill ok" style="font-size:10px">達標</span>':''}</span></div>`;
        if(sk){const got=computeAdminScore(o.s.club).detail[sk]||0;scoreCell=`負責人會議（ad7）：<b style="color:var(--blue)">${got}</b> / 5`;}
      }else{
        const ck=o.s.confirmed&&o.s.confirmed[it.id];
        confirmCell=it.requiresConfirmation
          ?`<label style="display:inline-flex;gap:4px;align-items:center"><input type="checkbox" ${ck?'checked':''} onchange="toggleConfirm(${o.i},'${it.id}')"> ${ck?'<span class="pill ok" style="font-size:10px">已參與</span>':'<span class="pill wait" style="font-size:10px">未確認</span>'}</label>`
          :`<span class="pill ok" style="font-size:10px">✅ 自動確認（免審核）</span>`;
        if(sk){const got=computeAdminScore(o.s.club).detail[sk]||0;scoreCell=`${esc(it.name)}（${sk}）：<b style="color:var(--blue)">${got}</b> / 5`;}
      }
      return `<tr><td style="text-align:left"><b>${esc(o.s.club)}</b> <span class="muted" style="font-size:11px">${esc(clubTypeOf(o.s.club))}</span></td><td>${esc(o.s.presenter)}</td><td>${o.s.date}</td>${isAward?`<td style="font-size:12px">${(o.s.selectedAwards&&o.s.selectedAwards.length)?o.s.selectedAwards.map(id=>{const aw=awardById(id);return aw?`<span class="pill purple" style="font-size:10px;margin:0 3px 3px 0;display:inline-block">${esc(aw.name)}</span>`:esc(id);}).join(""):'<span class="muted">（未勾選獎項）</span>'}</td>`:''}<td>${confirmCell}</td><td>${scoreCell}</td></tr>`;
    }).join(""):"";
    const confLabel=it.sessionBased?'達標':(it.requiresConfirmation?'已確認':'自動確認');
    return `<details class="card" style="margin-bottom:12px;padding:0" ${regOpen[it.id]?'open':''} ontoggle="regOpen['${it.id}']=this.open">
      <summary style="cursor:pointer;overflow:hidden;padding:14px 18px;font-weight:600;color:var(--blue)">${esc(it.name)} ${it.open?'<span class="pill ok" style="font-size:10px">開放中</span>':'<span class="pill no" style="font-size:10px">未開放</span>'}${it.requiresConfirmation?'':' <span class="pill ok" style="font-size:10px">免審核</span>'}<span style="float:right;display:inline-flex;gap:6px"><span class="pill info">報名 ${regs.length}</span><span class="pill ok">${confLabel} ${confN}</span></span></summary>
      <div style="padding:0 18px 16px;overflow:auto"><div class="row-actions" style="margin:0 0 10px"><select id="addsignup_${it.id}" style="width:auto;padding:5px">${CLUBS.map(c=>`<option>${esc(c)}</option>`).join("")}</select><button class="btn ok sm" onclick="adminAddSignup('${it.id}')">➕ 手動新增名單</button><button class="btn ghost sm" onclick="printSignupList('${it.id}')">🖨️ 列印/匯出名單</button></div>${regs.length?`<table class="tb"><thead><tr><th style="text-align:left">社團</th><th>報告人</th><th>報名日</th>${isAward?'<th>報名獎項</th>':''}<th>${it.sessionBased?'各場次實際出席':'實際參與確認'}</th><th>對應行政成績</th></tr></thead><tbody>${rrows}</tbody></table>`:'<p class="muted">尚無社團報名此項目，可用上方「手動新增名單」加入</p>'}</div>
    </details>`;
  }).join("");
  return `<h1 class="page">報名管理</h1><p class="sub">設定開放報名項目與審核方式；「需審核」項目須由承辦人勾選確認實際參與才計分，「免審核」項目送出報名即自動確認計分</p>
  <div class="card"><h2>報名時間設定</h2><div class="grid g3">
    <label class="f"><span class="lab">報名開始</span><input type="date" id="rw_s" value="${w.start.replace(/\//g,'-')}"></label>
    <label class="f"><span class="lab">報名結束</span><input type="date" id="rw_e" value="${w.end.replace(/\//g,'-')}"></label>
    <label class="f"><span class="lab">　</span><button class="btn primary" onclick="saveRegWindow()">儲存報名時間</button></label>
  </div><p class="legend">目前報名期間：<b>${w.start} ～ ${w.end}</b></p></div>
  <div class="card"><h2>報名項目設定</h2>
    <p class="legend" style="margin-top:0">每個項目以卡片管理：可編輯資訊、開放/關閉、切換是否需審核、刪除。<b>場次制</b>項目（如負責人會議）可動態新增/刪除場次，並依日期<b>自動帶入學期</b>（2/1–7/31 上學期、8/1–隔年1/31 下學期）。</p>
    ${itemCards||'<p class="muted">尚無報名項目</p>'}
    <h3 style="font-size:14px;color:var(--blue);margin:16px 0 6px">新增報名項目</h3>
    <div class="grid g3">
      <label class="f"><span class="lab">項目名稱<i>*</i></span><input type="text" id="newSignupItem" placeholder="例：社團評鑑說明會"></label>
      <label class="f"><span class="lab">活動日期（自動判學期）</span><input type="date" id="newSignupDate"></label>
      <label class="f"><span class="lab">報名期限</span><input type="date" id="newSignupDeadline"></label>
      <label class="f"><span class="lab">時間</span><input type="text" id="newSignupTime" placeholder="例：2026/10/01 18:30"></label>
      <label class="f"><span class="lab">地點</span><input type="text" id="newSignupPlace" placeholder="例：TR-201"></label>
      <label class="f"><span class="lab">參與對象</span><input type="text" id="newSignupAudience" placeholder="例：各社團社長／副社長"></label>
      <label class="f"><span class="lab">說明</span><input type="text" id="newSignupNote" placeholder="補充說明（可留空）"></label>
      <label class="f"><span class="lab">審核方式</span><select id="newSignupReq"><option value="1">需審核確認（事後勾選實際參與）</option><option value="0">免審核（送出即自動確認）</option></select></label>
      <label class="f"><span class="lab">類型</span><select id="newSignupSession"><option value="0">單場（一次性）</option><option value="1">場次制（可分多場次，如負責人會議）</option></select></label>
    </div>
    <div class="row-actions"><button class="btn primary sm" onclick="addSignupItem()">＋ 新增報名項目</button></div>
  </div>
  <div class="card"><h2>報名名單與實際參與確認</h2>
    <p class="note blue" style="margin-top:0">依報名項目分組，點標題列展開查看報名社團。<b>場次制</b>（負責人會議）逐場勾選實際出席，累計滿 4 場給 ad7 滿分；<b>需審核</b>項目勾選「實際參與」才計分；<b>免審核</b>項目送出報名即自動確認計分。</p>
    ${panels||'<p class="muted">尚無報名項目</p>'}
  </div>`;
};
function saveRegWindow(){state.regWindow={start:$("#rw_s").value.replace(/-/g,"/"),end:$("#rw_e").value.replace(/-/g,"/")};toast("已儲存報名時間");render();}
function toggleSignupItem(id){const it=state.signupItems.find(x=>x.id===id);if(it){it.open=!it.open;toast(it.name+(it.open?" 已開放報名":" 已關閉報名"));render();}}
function delSignupItem(id){if(typeof confirm==="function"&&!confirm("確定刪除此報名項目？"))return;state.signupItems=state.signupItems.filter(x=>x.id!==id);state.signups.forEach(s=>{s.items=s.items.filter(x=>x!==id);if(s.confirmed)delete s.confirmed[id];});if(state.sessionAttend)delete state.sessionAttend[id];toast("已刪除報名項目");render();}
/* 切換是否需審核；改為免審核時，已報名者自動確認 */
function toggleRequiresConfirmation(id){const it=state.signupItems.find(x=>x.id===id);if(!it)return;it.requiresConfirmation=!it.requiresConfirmation;if(!it.requiresConfirmation&&!it.sessionBased){state.signups.forEach(s=>{if(s.items.includes(id)){s.confirmed=s.confirmed||{};s.confirmed[id]=true;}});}toast(it.name+(it.requiresConfirmation?" 已設為需審核確認":" 已設為免審核（報名自動確認）"));render();}
/* 場次：新增／刪除；新增時依日期自動帶入學期 */
function addSession(itemId){const it=state.signupItems.find(x=>x.id===itemId);if(!it)return;it.sessions=it.sessions||[];const ne=$("#ns_name_"+itemId),de=$("#ns_date_"+itemId);const name=ne?ne.value.trim():"";const date=de?(de.value||"").replace(/-/g,"/"):"";if(!name){toast("請輸入場次名稱");return;}it.sessions.push({id:uid("m"),name:name,date:date,semester:semesterOf(date)});toast("已新增場次："+name+(date?("（"+semesterOf(date)+"）"):""));render();}
function delSession(itemId,sid){const it=state.signupItems.find(x=>x.id===itemId);if(!it||!it.sessions)return;it.sessions=it.sessions.filter(s=>s.id!==sid);if(state.sessionAttend&&state.sessionAttend[itemId])Object.keys(state.sessionAttend[itemId]).forEach(c=>{if(state.sessionAttend[itemId][c])delete state.sessionAttend[itemId][c][sid];});toast("已刪除場次");render();}
/* 勾選某社團某場次實際出席；同步 confirmed 供顯示 */
function toggleSessionAttend(itemId,club,sid){state.sessionAttend=state.sessionAttend||{};state.sessionAttend[itemId]=state.sessionAttend[itemId]||{};state.sessionAttend[itemId][club]=state.sessionAttend[itemId][club]||{};state.sessionAttend[itemId][club][sid]=!state.sessionAttend[itemId][club][sid];const cnt=attendedCount(itemId,club);const s=state.signups.find(x=>x.club===club);if(s){s.confirmed=s.confirmed||{};s.confirmed[itemId]=cnt>=4;}toast(club+" 場次出席已更新，累計 "+cnt+" 場"+(cnt>=4?"（達標）":""));render();}
function signupItemInfo(it){const sem=it.semester||semesterOf(it.date);return [sem?'📅 '+esc(sem):'',it.date?'活動日 '+esc(it.date):'',it.time?'🕒 '+esc(it.time):'',it.place?'📍 '+esc(it.place):'',it.deadline?'報名期限 '+esc(it.deadline):'',it.audience?'對象：'+esc(it.audience):''].filter(Boolean).join('　·　');}
function addSignupItem(){const n=$("#newSignupItem").value.trim();if(!n){toast("請輸入項目名稱");return;}const date=$("#newSignupDate")?($("#newSignupDate").value||"").replace(/-/g,"/"):"";const req=$("#newSignupReq")?$("#newSignupReq").value==="1":true;const sess=$("#newSignupSession")?$("#newSignupSession").value==="1":false;const it={id:uid("s"),name:n,open:true,requiresConfirmation:req,sessionBased:sess,date:date,semester:semesterOf(date),note:$("#newSignupNote")?$("#newSignupNote").value.trim():"",time:$("#newSignupTime")?$("#newSignupTime").value.trim():"",place:$("#newSignupPlace")?$("#newSignupPlace").value.trim():"",deadline:$("#newSignupDeadline")?($("#newSignupDeadline").value||"").replace(/-/g,"/"):"",audience:$("#newSignupAudience")?$("#newSignupAudience").value.trim():""};if(sess)it.sessions=[];state.signupItems.push(it);toast("已新增報名項目："+n+(sess?"（場次制）":"")+(date?("｜"+semesterOf(date)):""));render();}
function editSignupItem(id){const it=state.signupItems.find(x=>x.id===id);if(!it)return;modal(`<h3>編輯報名項目：${esc(it.name)}</h3>
  <label class="f"><span class="lab">項目名稱</span><input type="text" id="ei_name" value="${esc(it.name)}"></label>
  <div class="grid g2">
    <label class="f"><span class="lab">活動日期（自動判學期）</span><input type="date" id="ei_date" value="${(it.date||'').replace(/\//g,'-')}"></label>
    <label class="f"><span class="lab">審核方式</span><select id="ei_req"><option value="1" ${it.requiresConfirmation?'selected':''}>需審核確認</option><option value="0" ${it.requiresConfirmation?'':'selected'}>免審核（自動確認）</option></select></label>
    <label class="f"><span class="lab">時間</span><input type="text" id="ei_time" value="${esc(it.time||'')}" placeholder="例：2026/10/01 18:30"></label>
    <label class="f"><span class="lab">地點</span><input type="text" id="ei_place" value="${esc(it.place||'')}" placeholder="例：TR-201"></label>
    <label class="f"><span class="lab">報名期限</span><input type="date" id="ei_deadline" value="${(it.deadline||'').replace(/\//g,'-')}"></label>
    <label class="f"><span class="lab">參與對象</span><input type="text" id="ei_audience" value="${esc(it.audience||'')}" placeholder="例：各社團社長"></label>
  </div>
  <label class="f"><span class="lab">說明</span><textarea id="ei_note">${esc(it.note||'')}</textarea></label>
  ${it.sessionBased?'<div class="note blue" style="font-size:12px">此為場次制項目，場次請於項目卡片上直接新增/刪除。</div>':''}
  <div class="row-actions" style="margin-top:6px"><button class="btn primary" onclick="saveSignupItem('${id}')">儲存資訊</button></div>`);}
function saveSignupItem(id){const it=state.signupItems.find(x=>x.id===id);if(!it)return;it.name=$("#ei_name").value.trim()||it.name;it.date=($("#ei_date").value||'').replace(/-/g,'/');it.semester=semesterOf(it.date);const wasReq=it.requiresConfirmation;it.requiresConfirmation=$("#ei_req").value==="1";it.time=$("#ei_time").value.trim();it.place=$("#ei_place").value.trim();it.deadline=($("#ei_deadline").value||'').replace(/-/g,'/');it.audience=$("#ei_audience").value.trim();it.note=$("#ei_note").value.trim();if(wasReq&&!it.requiresConfirmation&&!it.sessionBased){state.signups.forEach(s=>{if(s.items.includes(id)){s.confirmed=s.confirmed||{};s.confirmed[id]=true;}});}closeModal();toast("已更新報名項目資訊");render();}
function toggleConfirm(i,itemId){const s=state.signups[i];if(!s)return;s.confirmed=s.confirmed||{};s.confirmed[itemId]=!s.confirmed[itemId];const it=state.signupItems.find(x=>x.id===itemId);toast(`${s.club}　${it?it.name:''} → ${s.confirmed[itemId]?'已確認實際參與':'取消參與確認'}`);render();}
/* 管理員手動代報名：選社團直接加入該項目名單（不受報名期限限制） */
function adminAddSignup(itemId){const sel=$("#addsignup_"+itemId);const club=sel?sel.value:"";if(!club)return;const it=state.signupItems.find(x=>x.id===itemId);const auto=it&&!it.sessionBased&&!it.requiresConfirmation;let s=state.signups.find(x=>x.club===club);if(s){if(s.items.includes(itemId)){toast(club+" 已在此項目名單中");return;}s.items.push(itemId);s.confirmed=s.confirmed||{};s.confirmed[itemId]=auto?true:false;}else{const confirmed={};confirmed[itemId]=auto?true:false;state.signups.push({club:club,presenter:"（管理員代報名）",items:[itemId],note:"管理員手動新增",date:today(),confirmed:confirmed,selectedAwards:[]});}audit("管理員手動代報名",club+"／"+(it?it.name:itemId));toast("已將 "+club+" 手動加入「"+(it?it.name:itemId)+"」名單"+(auto?"（免審核已自動確認）":""));render();}
/* 報名名單列印／匯出：依社團性質、社團名稱排序，含簽到欄 */
function printSignupList(itemId){const it=state.signupItems.find(x=>x.id===itemId);if(!it)return;
  const regs=state.signups.filter(s=>s.items.includes(itemId)).slice();
  regs.sort((a,b)=>{const ta=ATTRS.indexOf(clubTypeOf(a.club)),tb=ATTRS.indexOf(clubTypeOf(b.club));const da=ta<0?99:ta,db=tb<0?99:tb;if(da!==db)return da-db;return (a.club||"").localeCompare(b.club||"","zh-Hant");});
  const rows=regs.length?regs.map((s,i)=>{let join=esc(it.name);if(itemId==='s3'&&s.selectedAwards&&s.selectedAwards.length)join='報名獎項：'+s.selectedAwards.map(id=>{const aw=awardById(id);return aw?esc(aw.name):esc(id);}).join("、");return `<tr><td style="text-align:center">${i+1}</td><td>${esc(clubTypeOf(s.club))}</td><td>${esc(s.club)}</td><td>${esc(s.presenter||'')}</td><td>${join}</td><td style="width:110px">&nbsp;</td></tr>`;}).join(""):`<tr><td colspan="6" style="text-align:center">尚無報名名單</td></tr>`;
  const body=`<h1>${esc(it.name)}　報名名單</h1>
  <div style="text-align:center;color:#666;font-size:12px;margin-bottom:8px">排序：先依社團性質、再依社團名稱　·　共 ${regs.length} 個社團　·　產製時間：${nowTime()}</div>
  <table><thead><tr><th style="width:48px">序號</th><th style="width:90px">社團性質</th><th>社團名稱</th><th style="width:120px">代表人</th><th>參與項目／獎項</th><th style="width:110px">簽到</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="muted">＊「簽到」欄位留白供現場手寫簽名。</div>`;
  printDoc(it.name+"_報名名單",body);
}
PAGES.admin.agroup=()=>{
  const approved=state.signups.filter(s=>s.items.includes('s3')).map(s=>s.club);
  const pool=[...new Set([...CLUBS])];
  const groupCards=state.groups.map(g=>{
    const cl=pool.map(c=>`<label style="display:inline-flex;gap:4px;align-items:center;margin:0 10px 6px 0;font-size:13px"><input type="checkbox" ${g.clubs.includes(c)?'checked':''} onchange="toggleGroupClub('${g.id}','${esc(c)}')"> ${esc(c)}</label>`).join("");
    const rv=[0,1].map(idx=>`<select onchange="setGroupReviewer('${g.id}',${idx},this.value)" style="width:auto;padding:5px 8px"><option value="">評審${idx+1}…</option>${VIEWERS.map(v=>`<option value="${v.id}" ${g.reviewers[idx]===v.id?'selected':''}>${esc(v.name)}</option>`).join("")}</select>`).join(" ");
    return `<div class="card"><h2>${esc(g.name)} <button class="btn warn xs" onclick="delGroup('${g.id}')" style="margin-left:8px">刪除組別</button></h2>
    <p class="legend" style="margin-top:0">勾選本組社團：</p><div style="margin-bottom:10px">${cl}</div>
    <p class="legend">指派本組評審老師（最佳社團獎採兩位老師平均 ×60%）：</p><div class="row-actions">${rv}</div>
    <p class="muted" style="font-size:12px;margin-top:8px">本組 ${g.clubs.length} 社團　·　評審：${g.reviewers.filter(Boolean).map(id=>{const v=VIEWERS.find(x=>x.id===id);return v?esc(v.name):'';}).join("、")||'未指派'}</p></div>`;
  }).join("");
  /* 與「社團競賽(評鑑)」報名名單結合：各獎項列出報名社團供直接勾選並指派評審 */
  const rosterCard=`<div class="card"><h2>🏆 各獎項報名名單（依報名直接勾選指派評審）</h2>
    <p class="legend" style="margin-top:0">下列為各獎項之「社團競賽(評鑑)」報名社團（取自報名時勾選的參賽獎項）。可直接勾選社團並指派評審老師，套用後評審即可在評審端看到對應社團；已指派者預設勾選。<b>最佳社團獎</b>請改用下方「組別」分組指派（採兩位老師平均）。</p>
    ${AWARDS.filter(a=>a.id!=='club').map(a=>{const cs=clubsForAward(a.id);return `<div class="card" style="margin:0 0 10px"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b style="color:var(--blue)">${esc(a.name)}</b> <span class="pill ${a.type==='個人'?'purple':'info'}" style="font-size:10px">${a.type}</span> <span class="muted" style="font-size:12px">報名 ${cs.length} 社團</span></div>
      <div style="margin:8px 0">${cs.length?cs.map(c=>`<label style="display:inline-flex;gap:4px;align-items:center;margin:0 12px 6px 0;font-size:13px"><input type="checkbox" class="ra_${a.id}" data-club="${esc(c)}" ${clubAssignedToAward(c,a.id)?'checked':''}> ${esc(c)} <span class="muted" style="font-size:11px">（${esc(clubTypeOf(c))}）</span></label>`).join(""):'<span class="muted">尚無社團報名此獎項</span>'}</div>
      ${cs.length?`<div class="row-actions"><span class="muted" style="font-size:12px;align-self:center">指派評審：</span>${[0,1].map(idx=>`<select id="ra_rv_${a.id}_${idx}" style="width:auto;padding:5px 8px"><option value="">評審${idx+1}…</option>${VIEWERS.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join("")}</select>`).join(" ")}<button class="btn primary sm" onclick="applyAwardRoster('${a.id}')">套用指派</button></div>`:''}
    </div>`;}).join("")}
  </div>`;
  return `<h1 class="page">分組與評審指派</h1><p class="sub">可從「社團競賽(評鑑)」報名名單依各獎項直接勾選社團並指派評審；最佳社團獎另可用下方「組別」採兩位老師平均</p>
  <div class="note blue">已報名競賽(評鑑)：${approved.length?approved.map(esc).join("、"):'（尚無，請先至「報名管理」或請社團報名）'}</div>
  ${rosterCard}
  <div class="row-actions" style="margin:14px 0"><input type="text" id="newGroup" placeholder="組別名稱，如 第6組" style="width:auto"><button class="btn primary sm" onclick="addGroup()">＋ 新增組別（最佳社團獎兩位老師平均）</button></div>
  ${groupCards||'<div class="card"><p class="muted">尚無組別，請新增。</p></div>'}`;
};
function clubsForAward(aid){return CLUBS.filter(c=>state.signups.some(s=>s.club===c&&(s.selectedAwards||[]).includes(aid)));}
/* 競賽檢核線：某社團某獎項的「報名 → 資料上傳 → 評審指派」狀態 */
function awardChain(club,aid){const registered=clubsForAward(aid).includes(club);const a=awardById(aid);const items=awardItems(a);const done=items.filter(it=>fileList(club,it.key).length).length;const reviewer=VIEWERS.some(v=>v.awards.includes(aid)&&v.clubs.includes(club));return {registered,done,total:items.length,complete:items.length>0&&done===items.length,some:done>0,reviewer};}
function clubAssignedToAward(c,aid){return VIEWERS.some(v=>v.awards.includes(aid)&&v.clubs.includes(c));}
function applyAwardRoster(aid){const clubs=$$(".ra_"+aid).filter(c=>c.checked).map(c=>c.dataset.club);const rvs=[0,1].map(idx=>{const s=$("#ra_rv_"+aid+"_"+idx);return s?s.value:"";}).filter(Boolean);if(!clubs.length){toast("請至少勾選一個社團");return;}if(!rvs.length){toast("請至少指派一位評審");return;}rvs.forEach(vid=>{const v=VIEWERS.find(x=>x.id===vid);if(v){if(!v.awards.includes(aid))v.awards.push(aid);clubs.forEach(c=>{if(!v.clubs.includes(c))v.clubs.push(c);});}});const a=awardById(aid);const names=rvs.map(id=>{const v=VIEWERS.find(x=>x.id===id);return v?v.name:'';}).filter(Boolean).join("、");notifyEmail(a.name+" 已依報名名單指派 "+clubs.length+" 社團給評審："+names);toast(a.name+"：已將 "+clubs.length+" 個社團指派給 "+rvs.length+" 位評審（"+names+"）");render();}
function addGroup(){const n=$("#newGroup").value.trim()||("第"+(state.groups.length+1)+"組");state.groups.push({id:"g"+Date.now(),name:n,clubs:[],reviewers:["",""]});toast("已新增組別："+n);render();}
function delGroup(id){state.groups=state.groups.filter(g=>g.id!==id);syncGroups();toast("已刪除組別");render();}
function toggleGroupClub(id,club){const g=state.groups.find(x=>x.id===id);g.clubs=g.clubs.includes(club)?g.clubs.filter(c=>c!==club):[...g.clubs,club];syncGroups();render();}
function setGroupReviewer(id,idx,vid){const g=state.groups.find(x=>x.id===id);g.reviewers[idx]=vid;syncGroups();render();}
function syncGroups(){state.groups.forEach(g=>g.reviewers.filter(Boolean).forEach(vid=>{const v=VIEWERS.find(x=>x.id===vid);if(v){g.clubs.forEach(c=>{if(!v.clubs.includes(c))v.clubs.push(c);});if(!v.awards.includes("club"))v.awards.push("club");}}));}

/* ===== 最高權限：逾期追蹤與停權管理（手動停權／取消停權） ===== */
function adminName(){const a=ADMINS.find(x=>x.id===state.adminUser);return a?a.name:"管理員";}
PAGES.admin.asusp=()=>{
  if(!adminIsSuper())return `<div class="card"><p class="muted">本功能僅限最高權限管理員使用。</p></div>`;
  const lent=state.bookings.filter(b=>b.kind==="器材"&&b.status==="已借出");
  const lrows=lent.length?lent.map(b=>{const od=isOverdueNow(b.endDate);return `<tr><td>#${b.id}</td><td>${esc(b.club)}</td><td>${esc(b.item)}（${b.qty||1}）</td><td>${esc(b.borrowDate||b.date)}</td><td>${b.endDate?dueText(b.endDate):'—'}</td><td>${od?'<span class="pill no">逾期未還</span>':'<span class="pill purple">借出中</span>'}</td><td style="font-size:12px">${esc(b.borrowerSid||'—')}／${esc(b.lenderName||'—')}</td></tr>`;}).join(""):`<tr><td colspan="7" class="muted" style="text-align:center">目前無借出中（未歸還）器材</td></tr>`;
  const crows=CLUBS.map(c=>{const m=clubMeta(c);const susp=isSuspended(c);return `<tr><td><b>${esc(c)}</b></td><td><b style="color:${m.overdue>=3?'var(--warn)':'var(--ink)'}">${m.overdue||0}</b> 次</td><td>${susp?`<span class="pill no">停權中${m.until?'（至 '+esc(m.until)+'）':''}</span>`:'<span class="pill ok">正常</span>'}</td><td style="font-size:12px">${esc(m.reason||'—')}</td><td><div class="row-actions">${susp?`<button class="btn ok sm" onclick="adminUnsuspend('${esc(c)}','已賠償')">取消停權（已賠償）</button><button class="btn ok sm" onclick="adminUnsuspend('${esc(c)}','已做愛校服務')">取消停權（已做愛校服務）</button>`:`<button class="btn warn sm" onclick="adminSuspend('${esc(c)}')">手動停權</button>`}</div></td></tr>`;}).join("");
  return `<h1 class="page">逾期追蹤與停權管理</h1><p class="sub">最高權限管理員可追蹤器材歸還進度，並於毀損未賠償時手動停權；社團願賠償或停權期間完成愛校服務後，可手動取消停權</p>
  <div class="note">器材逾期累計 3 次系統會自動停權一個月；本頁可由最高權限者<b>手動停權／取消停權</b>：社團毀壞器材不願賠償可手動停權，社團願意賠償、或停權期間有做愛校服務，皆可手動取消停權。</div>
  <div class="card" style="overflow:auto"><h2>器材歸還進度追蹤</h2><table class="tb"><thead><tr><th>#</th><th>社團</th><th>器材(數量)</th><th>借出日</th><th>應歸還</th><th>進度</th><th>借用人／出借人</th></tr></thead><tbody>${lrows}</tbody></table></div>
  <div class="card" style="overflow:auto"><h2>社團借用權與停權管理</h2><table class="tb"><thead><tr><th>社團</th><th>逾期次數</th><th>借用權</th><th>停權事由</th><th>手動處置</th></tr></thead><tbody>${crows}</tbody></table></div>`;
};
function adminSuspend(club){if(!adminIsSuper())return;const r=requireReason("手動停權原因（必填）：","毀壞器材未賠償");if(r===null)return;const until=prompt("停權至（YYYY/MM/DD，留空＝一個月後）：",addMonthStr());suspendClub(club,r,(until&&until.trim())?until.trim():addMonthStr());audit("手動停權",club+"："+r+"（至 "+clubMeta(club).until+"）");notifyEmail(club+" 經最高權限管理員手動停權："+r);toast(club+" 已手動停權");render();}
function adminUnsuspend(club,reason){if(!adminIsSuper())return;const m=clubMeta(club);unsuspendClub(club);m.overdue=0;m.reason="";audit("取消停權",club+"（"+reason+"）");notifyEmail(club+" 經最高權限管理員手動取消停權（"+reason+"）");toast(club+" 已取消停權（"+reason+"）");render();}

function addFixRoom(){if(!adminIsSuper())return;const n=$("#nr_name").value.trim();if(!n){toast("請輸入教室名稱");return;}if(ROOMS.includes(n)){toast("教室已存在");return;}ROOMS.push(n);toast("已新增固定借用教室："+n);render();}

function addVenue(){if(!adminIsSuper())return;const n=$("#nv_name").value.trim(),cat=$("#nv_cat").value.trim()||"教室",cap=+$("#nv_cap").value||0;if(!n){toast("請輸入場地名稱");return;}if(VENUES.some(v=>v.name===n)){toast("場地已存在");return;}VENUES.push({name:n,cat:cat,cap:cap});toast("已新增場地／教室："+n);render();}
function delVenue(n){if(!adminIsSuper())return;const i=VENUES.findIndex(v=>v.name===n);if(i<0)return;VENUES.splice(i,1);toast("已刪除場地／教室："+n);render();}
function addEquip(){if(!adminIsSuper())return;const n=$("#ne_name").value.trim(),cat=$("#ne_cat").value.trim()||"一般",t=+$("#ne_total").value||0;if(!n){toast("請輸入器材名稱");return;}if(EQUIP.some(e=>e.name===n)){toast("器材已存在");return;}EQUIP.push({name:n,emoji:"📦",cat:cat,total:t,avail:t});toast("已新增器材："+n);render();}
function delEquip(n){if(!adminIsSuper())return;const i=EQUIP.findIndex(e=>e.name===n);if(i<0)return;EQUIP.splice(i,1);toast("已刪除器材："+n);render();}
function adminBookVenue(){if(!adminIsSuper())return;const c=$("#mbv_club").value,r=$("#mbv_room").value,d=$("#mbv_date").value,s=gatherSlots('mbv_slotbtns').join(",");if(!c||!r||!d){toast("請選擇社團、場地與日期");return;}state.bookings.push({id:state.seq++,club:c,kind:"場地",item:r,detail:"節次 "+(s||'—')+" ｜ 管理員代借",date:d.replace(/-/g,"/"),status:"已核准"});audit("管理員代借場地",c+"／"+r+"（節次 "+(s||'—')+"）");notifyEmail(c+" 由管理員手動借用場地 "+r);toast("已為 "+c+" 手動借用場地 "+r);render();}
function adminBookEquip(){if(!adminIsSuper())return;const c=$("#mbe_club").value,it=$("#mbe_item").value,q=+$("#mbe_qty").value,d=$("#mbe_date").value,en=$("#mbe_end").value;if(!c||!it||!q||q<1||!d||!en){toast("請完整填寫社團、器材、數量與日期");return;}if(q>eqRemain(it)){toast("數量超過剩餘量（剩 "+eqRemain(it)+"）");return;}const e=eqByName(it);if(e)e.avail=Math.max(0,e.avail-q);state.bookings.push({id:state.seq++,club:c,kind:"器材",item:it,detail:"數量 "+q+" ｜ 管理員代借",qty:q,date:d.replace(/-/g,"/"),endDate:en.replace(/-/g,"/"),status:"已借出",borrowDate:today(),borrowerSid:"管理員代借",lenderName:adminName(),staffOut:adminName()});audit("管理員代借器材",c+"／"+it+"×"+q);notifyEmail(c+" 由管理員手動借出器材 "+it+"×"+q);toast("已為 "+c+" 手動借出器材 "+it+" ×"+q);render();}
function adminCancelBooking(id){if(!adminIsSuper())return;const b=state.bookings.find(x=>x.id===id);if(!b)return;if(typeof confirm==="function"&&!confirm("確定取消此借用？"))return;if(b.kind==="器材"&&b.status==="已借出"){const e=eqByName(b.item);if(e)e.avail=Math.min(e.total,e.avail+(b.qty||1));}state.bookings=state.bookings.filter(x=>x.id!==id);audit("管理員取消借用",b.kind+"「"+b.item+"」／"+b.club);toast("#"+id+" 借用已由管理員取消");render();}
PAGES.admin.aresource=()=>{
  if(!adminIsSuper())return `<div class="card"><p class="muted">本功能僅限最高權限管理員使用。</p></div>`;
  const w=roomFixWin();
  const venueRows=VENUES.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.cat)}</td><td>${v.cap}</td><td><button class="btn warn xs" onclick="delVenue('${esc(v.name)}')">刪除</button></td></tr>`).join("");
  const equipRows=EQUIP.map(e=>`<tr><td>${e.emoji||'📦'} ${esc(e.name)}</td><td>${esc(e.cat)}</td><td>${e.total}</td><td>${e.avail}</td><td><button class="btn warn xs" onclick="delEquip('${esc(e.name)}')">刪除</button></td></tr>`).join("");

  const active=state.bookings.filter(b=>b.status==='待審'||b.status==='已核准'||b.status==='已借出');

  return `<h1 class="page">教室／器材與手動借用</h1><p class="sub">最高權限管理員可新增／刪減教室與器材名稱、設定教室固定借用開放期間，並手動為社團借用或取消教室／器材</p>
  <div class="note blue"><b>教室借用兩種模式</b>：① <b>固定借用</b>－開放一段期間讓社團登記固定節次，最高權限者依各社團登記狀況，決定某一期間固定時段固定由該社使用（社團端「教室固定借用登記」、後台「教室固定借用審核」）。② <b>臨時借用</b>－社團隨時於「場地借用申請」填寫，最高權限者隨時審核，核准後社團即可隨時借用。</div>
  <div class="card"><h2>教室固定借用開放期間</h2>
    <div class="grid g3">
      <label class="f"><span class="lab">開放登記起</span><input type="date" id="rfw_s" value="${w.start.replace(/\//g,'-')}"></label>
      <label class="f"><span class="lab">開放登記迄</span><input type="date" id="rfw_e" value="${w.end.replace(/\//g,'-')}"></label>
      <label class="f"><span class="lab">　</span><div class="row-actions"><button class="btn primary" onclick="saveRoomFixWin()">儲存期間</button><button class="btn ${w.open?'warn':'ok'}" onclick="toggleRoomFixWin()">${w.open?'關閉登記':'開放登記'}</button></div></label>
    </div>
    <p class="legend">目前：${w.open?'<span class="pill ok">開放登記中</span>':'<span class="pill no">已關閉登記</span>'}　·　期間 <b>${w.start} ～ ${w.end}</b></p>
  </div>
  <div class="card"><h2>固定借用教室清單</h2>
    <div style="margin-bottom:10px">${fixRoomRows||'<span class="muted">尚無教室</span>'}</div>
    <div class="row-actions"><input type="text" id="nr_name" placeholder="新增固定借用教室名稱" style="width:auto"><button class="btn primary sm" onclick="addFixRoom()">＋ 新增教室</button></div>
  </div>
  <div class="card" style="overflow:auto"><h2>場地／教室清單（臨時借用用）</h2>
    <table class="tb"><thead><tr><th>場地名稱</th><th>類別</th><th>容納</th><th>操作</th></tr></thead><tbody>${venueRows}</tbody></table>
    <div class="grid g4" style="margin-top:12px">
      <label class="f"><span class="lab">場地名稱</span><input type="text" id="nv_name" placeholder="例：316"></label>
      <label class="f"><span class="lab">類別</span><input type="text" id="nv_cat" placeholder="教室／練習空間…" value="教室"></label>
      <label class="f"><span class="lab">容納人數</span><input type="number" id="nv_cap" min="0" placeholder="人數"></label>
      <label class="f"><span class="lab">　</span><button class="btn primary" onclick="addVenue()">＋ 新增場地</button></label>
    </div>
  </div>
  <div class="card" style="overflow:auto"><h2>器材清單</h2>
    <table class="tb"><thead><tr><th>器材名稱</th><th>類別</th><th>總數</th><th>剩餘</th><th>操作</th></tr></thead><tbody>${equipRows}</tbody></table>
    <div class="grid g4" style="margin-top:12px">
      <label class="f"><span class="lab">器材名稱</span><input type="text" id="ne_name" placeholder="例：無線麥克風"></label>
      <label class="f"><span class="lab">類別</span><input type="text" id="ne_cat" placeholder="一般／電子設備…" value="一般"></label>
      <label class="f"><span class="lab">總數</span><input type="number" id="ne_total" min="0" placeholder="數量"></label>
      <label class="f"><span class="lab">　</span><button class="btn primary" onclick="addEquip()">＋ 新增器材</button></label>
    </div>
  </div>
  <div class="card"><h2>手動為社團借用</h2>
    <h3 style="font-size:14px;color:var(--blue);margin:6px 0">場地／教室（建立後直接核准）</h3>
    <div class="grid g3">
      <label class="f"><span class="lab">社團</span><select id="mbv_club">${opt(CLUBS,state.club)}</select></label>
      <label class="f"><span class="lab">場地</span><select id="mbv_room"><option value="">請選擇…</option>${VENUES.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}</option>`).join("")}</select></label>
      <label class="f"><span class="lab">日期</span><input type="date" id="mbv_date"></label>
    </div>
    <label class="f"><span class="lab">節次（點選，可複選）</span>${slotBtns('mbv_slotbtns')}</label>
    <div class="row-actions"><button class="btn primary" onclick="adminBookVenue()">建立場地借用</button></div>
    <h3 style="font-size:14px;color:var(--blue);margin:14px 0 6px">器材（建立後直接借出並扣庫存）</h3>
    <div class="grid g5">
      <label class="f"><span class="lab">社團</span><select id="mbe_club">${opt(CLUBS,state.club)}</select></label>
      <label class="f"><span class="lab">器材</span><select id="mbe_item"><option value="">請選擇…</option>${EQUIP.map(e=>`<option value="${esc(e.name)}">${esc(e.name)}（剩 ${e.avail}）</option>`).join("")}</select></label>
      <label class="f"><span class="lab">數量</span><input type="number" id="mbe_qty" min="1" placeholder="數量"></label>
      <label class="f"><span class="lab">領用日</span><input type="date" id="mbe_date"></label>
      <label class="f"><span class="lab">結束日</span><input type="date" id="mbe_end"></label>
    </div>
    <div class="row-actions"><button class="btn primary" onclick="adminBookEquip()">建立器材借出</button></div>
  </div>
  <div class="card" style="overflow:auto"><h2>進行中借用（可手動取消）</h2>
    <table class="tb"><thead><tr><th>#</th><th>社團</th><th>類型</th><th>項目</th><th>明細</th><th>狀態</th><th>操作</th></tr></thead><tbody>${actRows}</tbody></table>
  </div>`;
};

/* ===== localStorage 持久化（單機、單一瀏覽器；非正式資料庫） ===== */
const PERSIST_KEY="ntust_club_sys_v1";
const PERSIST_VER=2; /* schema 版本：欄位有破壞性變更時 +1，舊存檔自動忽略以免殘缺 */
function persistSave(){try{localStorage.setItem(PERSIST_KEY,JSON.stringify({ver:PERSIST_VER,state:state,CLUBS:CLUBS,ADMINS:ADMINS,VIEWERS:VIEWERS,EQUIP:EQUIP,VENUES:VENUES,ROOMS:ROOMS}));}catch(e){}}
function persistLoad(){try{const r=localStorage.getItem(PERSIST_KEY);if(!r)return false;const s=JSON.parse(r);if(s.ver!==PERSIST_VER){return false;} /* 版本不符＝沿用程式內建示範資料，避免舊結構覆蓋 */
  if(s.state){for(const k in s.state)state[k]=s.state[k];}if(Array.isArray(s.CLUBS))CLUBS=s.CLUBS;if(Array.isArray(s.ADMINS))ADMINS=s.ADMINS;if(Array.isArray(s.VIEWERS))VIEWERS=s.VIEWERS;if(Array.isArray(s.EQUIP)){EQUIP.length=0;s.EQUIP.forEach(x=>EQUIP.push(x));}if(Array.isArray(s.VENUES)){VENUES.length=0;s.VENUES.forEach(x=>VENUES.push(x));}if(Array.isArray(s.ROOMS)){ROOMS.length=0;s.ROOMS.forEach(x=>ROOMS.push(x));}
  state.loggedIn=false;state.currentUser=null; /* 不保留登入狀態：刷新/重開需重新登入，避免共用電腦看到上一位的機密畫面 */
  return true;}catch(e){return false;}}
function resetDemo(){if(typeof confirm==="function"&&!confirm("確定清除所有已儲存資料並回到示範初始狀態？此動作無法復原。"))return;try{localStorage.removeItem(PERSIST_KEY);}catch(e){}try{location.reload();}catch(e){toast("請手動重新整理頁面");}}
/* 內建自我測試：核心計分/換算邏輯，開發時於 console 顯示通過或失敗（不影響使用者畫面） */
function runSelfTests(){try{const T=[];const chk=(n,c)=>T.push({n,ok:!!c});const near=(a,b)=>Math.abs(a-b)<0.1;
  chk("學期 2026/03 上",semesterOf("2026/03/05")==="上學期");
  chk("學期 2026/08 下",semesterOf("2026/08/01")==="下學期");
  chk("學期 2027/01 下",semesterOf("2027/01/07")==="下學期");
  chk("成果發表獎配分=100",RESULT_RUBRIC.reduce((t,it)=>t+it.max,0)===100);
  chk("負責人獎配分=100",LEADER_RUBRIC.reduce((t,it)=>t+it.max,0)===100);
  chk("行政資料配分=100",AD_RUBRIC.reduce((t,it)=>t+it.max,0)===100);
  chk("社團營運配分=100",OP_RUBRIC.reduce((t,it)=>t+it.max,0)===100);
  const sr={award:"result",items:{}};RESULT_RUBRIC.forEach(it=>sr.items[it.key]={score:it.max});chk("成果發表滿分=100",near(scorePct(sr),100));
  const sa={award:"activity",present:20,items:{}};ACTV_RUBRIC.forEach(it=>sa.items[it.key]={score:it.max});chk("活動獎滿分+簡報20=100",near(scorePct(sa),100));
  const sa0={award:"activity",present:0,items:{}};ACTV_RUBRIC.forEach(it=>sa0.items[it.key]={score:it.max});chk("活動獎滿分+簡報0=80",near(scorePct(sa0),80));
  const sc={award:"club",bonus:0,penalty:0,items:{}};AD_RUBRIC.forEach(it=>sc.items[it.key]={score:it.max});OP_RUBRIC.forEach(it=>sc.items[it.key]={score:it.max});chk("最佳社團獎滿分=100",near(scorePct(sc),100));
  chk("等第 A+",gradeOf(95)==="A+");chk("等第 D",gradeOf(50)==="D");
  chk("夜間節次集合含第A節",NIGHT_SLOTS.has("第A節")&&!NIGHT_SLOTS.has("第3節"));
  const fails=T.filter(x=>!x.ok);
  if(fails.length)console.warn("⚠️ 內建自我測試未通過 "+fails.length+"/"+T.length+"：",fails.map(f=>f.n).join("、"));
  else console.log("✅ 內建自我測試全部通過（"+T.length+" 項）");
}catch(e){console.warn("自我測試執行錯誤：",e);}}
persistLoad();
syncGroups();
ensureClubAccounts();
ensureAdminAccounts();
ensureClubTypes();
render();
runSelfTests();


/* ===== v6 新增：公告附件 + 結案相片限圖片 ===== */
var annAttachBuf=[];
function annAttachHtml(an){if(!an.attachments||!an.attachments.length)return"";return '<div style="font-size:12px;margin-top:4px">\u{1F4CE} '+an.attachments.map(function(f){return '<a href="'+esc(f.url||"#")+'" download="'+esc(f.name)+'" style="color:var(--blue2)">'+esc(f.name)+'</a>';}).join("、")+'</div>';}
function anPickFiles(input){annAttachBuf=[].slice.call(input.files||[]).map(function(f){var url="";try{url=URL.createObjectURL(f);}catch(e){}return {name:f.name,url:url};});var box=$("#an_files");if(box)box.innerHTML=annAttachBuf.length?("\u{1F4CE} 已選擇："+annAttachBuf.map(function(f){return esc(f.name);}).join("、")):"";}
function onPhotoPick(input){var files=[].slice.call(input.files||[]);var okExt=/\.(jpe?g|png)$/i;var good=files.filter(function(f){return okExt.test(f.name)||f.type==="image/jpeg"||f.type==="image/png";});var bad=files.length-good.length;if(bad>0)toast("已略過 "+bad+" 個非圖片檔；活動照片僅限 JPG / PNG");var names=good.map(function(f){return f.name;});var hv=$("#cl_pv");if(hv)hv.value=names.join("、");var info=$("#cl_pinfo");if(info)info.textContent=good.length?("已選擇 "+good.length+" 張："+names.join("、")):"僅限 JPG / PNG 圖片檔（未選到有效圖片）";}
