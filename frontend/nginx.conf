# club-aio web 容器(edge proxy 之後的內層):serve SPA + 反代 /api
# 本檔掛載到 /etc/nginx/conf.d/default.conf(conf.d 位於 http context)

# --- 還原真實客戶端 IP ---
# 只有 edge proxy(VPC 內網)與 compose 內網打得進來(GCP 防火牆擋其餘來源),
# 信任這些私有網段送來的 X-Real-IP,restore 後 $remote_addr = 真實使用者 IP,
# 限流與稽核 IP 才會正確(否則整個 edge 共用一個限流桶)。
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# X-Forwarded-Proto:edge 有送就沿用,沒送(或本機直連)用自身 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 登入爆破防護(edge 只有地理白名單,速率限制在這層做;realip 之後為每人一桶)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

# 上傳併發限制(pre-body 防護的輔助:單一來源不得以並發 multipart 佔滿連線與暫存)
limit_conn_zone $binary_remote_addr zone=uploads:10m;
limit_conn_status 429;

server {
    listen 80;
    server_name _;

    # 用 Docker 內建 DNS + 變數延遲解析:backend 容器重建換 IP 時自動跟上,
    # 也避免 backend 未就緒時 nginx 直接啟動失敗
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # body 上限分層(2026-07-17 資安審查):FastAPI 會在驗證前先讀完整個 body,
    # 全站 256m 等於允許未登入者對任何 JSON 端點塞爆記憶體。
    # 預設 1m(一般 JSON;實際最大 JSON 遠小於此)、login 8k、
    # 僅明確的上傳端點保留 256m(最大單檔 200MB 維修影片,留裕度)。
    # 此為部署層 trust boundary,不隨 system_settings 調整
    client_max_body_size 1m;

    # 安全標頭(edge 已有基本組,這裡補 SPA 的 CSP 與嵌入防護)
    add_header X-Content-Type-Options "nosniff" always;
    # frame-src 'self':FilePreview 以 iframe 內嵌同源 /api/v1/files/{id} 的 PDF;
    # 允許被嵌的那一側(檔案回應)由 backend 僅對授權成功的 inline PDF 放寬 SAMEORIGIN
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

    # 429/413 也走統一 JSON 信封,前端只需解析一種格式
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"success":false,"data":null,"error":"請求過於頻繁,請稍後再試","meta":null}';
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"success":false,"data":null,"error":"內容超過大小上限","meta":null}';
    }
    # auth_request 擋下時由 nginx 產生 401/403(backend 回應不受影響:
    # proxy_intercept_errors 預設 off),一樣走統一 JSON 信封
    error_page 401 = @unauthed;
    location @unauthed {
        default_type application/json;
        return 401 '{"success":false,"data":null,"error":"請先登入","meta":{"code":"UNAUTHENTICATED"}}';
    }
    error_page 403 = @forbidden;
    location @forbidden {
        default_type application/json;
        return 403 '{"success":false,"data":null,"error":"沒有權限或驗證失敗,請重新整理頁面","meta":{"code":"FORBIDDEN"}}';
    }

    location = /api/v1/auth/login {
        client_max_body_size 8k;
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }

    # 上傳端點白名單(路徑對齊 backend UploadFile routes;新增上傳端點必須同步這裡):
    # 活動結案照片/申請附件、郵局存簿、維修佐證、評鑑資料
    location ~ ^/api/v1/club/(activities/[0-9]+/(photos|attachments)|postal-changes/[0-9]+/passbook|maintenance/[0-9]+/evidence|eval/awards/[a-z]+/items/[0-9]+/files)$ {
        client_max_body_size 256m;
        # 讀 body 前先驗 session/CSRF(子請求不帶 body):未登入的 multipart
        # 不會進到 FastAPI,也就不會 spool 到後端 /tmp
        auth_request /_upload_precheck;
        limit_conn uploads 4;
        client_body_timeout 30s;
        proxy_pass $backend_upstream;
        include /etc/nginx/proxy_headers.conf;
        # 大檔上傳直通後端串流寫盤,不在此緩衝整包
        proxy_request_buffering off;
    }

    # auth_request 子請求端點(僅供內部;cookie 與 X-CSRF-Token 隨原請求標頭轉送)
    location = /_upload_precheck {
        internal;
        proxy_pass $backend_upstream/api/v1/auth/precheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/proxy_headers.conf;
    }

    location /api {
        proxy_pass $backend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # 靜態資產長快取(檔名帶 hash)
    # 注意:location 內宣告 add_header 會停止繼承 server 層標頭,需重複必要項
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
