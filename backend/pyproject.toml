[project]
name = "club-aio-backend"
version = "0.1.0"
description = "臺科大社團管理系統 AIO — 後端 API"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "argon2-cffi",
    "aiosmtplib",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
    "pytest-timeout>=2.4.0",
    "pymysql>=1.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# 單一測試 30 秒上限(pytest-timeout):鎖競爭等異常直接失敗,不再無限卡住
timeout = 30
timeout_method = "thread"
# 全部測試共用同一個 event loop:app engine 的連線池綁 loop,分 loop 會炸
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"
# autogenerated migrations 不套用手寫程式碼風格
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
