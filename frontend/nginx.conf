# club-aio web 容器(edge proxy 之後的內層):serve SPA + 反代 /api
# 本檔掛載到 /etc/nginx/conf.d/default.conf(conf.d 位於 http context)

# --- 還原真實客戶端 IP ---
# 只有 edge proxy(VPC 內網)與 compose 內網打得進來(GCP 防火牆擋其餘來源),
# 信任這些私有網段送來的 X-Real-IP,restore 後 $remote_addr = 真實使用者 IP,
# 限流與稽核 IP 才會正確(否則整個 edge 共用一個限流桶)。
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

# X-Forwarded-Proto:edge 有送就沿用,沒送(或本機直連)用自身 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 登入爆破防護(edge 只有地理白名單,速率限制在這層做;realip 之後為每人一桶)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # 用 Docker 內建 DNS + 變數延遲解析:backend 容器重建換 IP 時自動跟上,
    # 也避免 backend 未就緒時 nginx 直接啟動失敗
    resolver 127.0.0.11 valid=10s;
    set $backend_upstream http://backend:8000;

    root /usr/share/nginx/html;
    index index.html;

    # 上傳上限:最大單檔 200MB(維修影片),留裕度
    client_max_body_size 256m;

    # 安全標頭(edge 已有基本組,這裡補 SPA 的 CSP 與嵌入防護)
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; base-uri 'self'" always;

    location /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass $backend_upstream;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api {
        proxy_pass $backend_upstream;
        include /etc/nginx/proxy_headers.conf;
        # 大檔上傳直通後端串流寫盤,不在此緩衝整包
        proxy_request_buffering off;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }

    # 靜態資產長快取(檔名帶 hash)
    # 注意:location 內宣告 add_header 會停止繼承 server 層標頭,需重複必要項
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
