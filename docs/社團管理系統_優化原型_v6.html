<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>臺科大社團管理系統 — 優化原型 v4</title>
<style>
  :root{
    --blue:#1f4e79;--blue2:#2e6db4;--blue-l:#e8f0fa;--line:#dde3ea;
    --ink:#1f2630;--muted:#69727d;--bg:#f4f6f9;--card:#fff;
    --ok:#1f9d57;--okbg:#e6f6ee;--warn:#c0392b;--warnbg:#fdecea;
    --amber:#b9770e;--amberbg:#fdf3e2;--purple:#6a3fb5;--purplebg:#f0eafb;--radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  header.top{background:var(--blue);color:#fff;padding:0 18px;display:flex;align-items:center;gap:14px;height:58px;position:sticky;top:0;z-index:30;flex-wrap:wrap}
  header.top .logo{font-weight:700;font-size:16px;letter-spacing:.4px}
  .roleswitch{margin-left:auto;display:flex;background:rgba(255,255,255,.12);border-radius:30px;padding:4px;flex-wrap:wrap}
  .roleswitch button{border:0;background:transparent;color:#dce6f2;padding:7px 14px;border-radius:30px;cursor:pointer;font-size:13.5px;font-weight:600}
  .roleswitch button.on{background:#fff;color:var(--blue)}
  .wrap{display:flex;min-height:calc(100vh - 58px)}
  nav.side{width:238px;background:#fff;border-right:1px solid var(--line);padding:12px 10px;flex-shrink:0}
  nav.side .grp{font-size:11.5px;color:var(--muted);margin:13px 10px 5px;letter-spacing:1px}
  nav.side a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:14px;margin-bottom:2px}
  nav.side a:hover{background:var(--blue-l)}
  nav.side a.on{background:var(--blue);color:#fff}
  nav.side a .dot{margin-left:auto;background:var(--warn);color:#fff;border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700}
  nav.side a.on .dot{background:#fff;color:var(--warn)}
  main{flex:1;padding:22px 26px;max-width:1140px}
  h1.page{font-size:21px;margin:0 0 4px;color:var(--blue)}
  .sub{color:var(--muted);margin:0 0 18px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
  .card h2{font-size:16px;margin:0 0 10px;color:var(--blue)}
  .card h2 .tag{font-size:11px;background:var(--blue-l);color:var(--blue);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle;font-weight:600}
  .note{background:var(--amberbg);border:1px solid #f0d9a8;border-left:4px solid var(--amber);border-radius:8px;padding:10px 14px;font-size:13px;color:#6b4e16;margin-bottom:16px}
  .note b{color:var(--amber)}
  .note.blue{background:var(--blue-l);border-color:#bcd4ee;border-left-color:var(--blue2);color:#244}
  .note.purple{background:var(--purplebg);border-color:#d9caf2;border-left-color:var(--purple);color:#43306e}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
  @media(max-width:860px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}.wrap{flex-direction:column}nav.side{width:100%;display:flex;flex-wrap:wrap}}
  label.f{display:block;margin-bottom:13px}
  label.f .lab{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
  label.f .lab i{color:var(--warn);font-style:normal;margin-left:3px}
  input[type=text],input[type=tel],input[type=date],input[type=number],input[type=url],input[type=time],input[type=password],select,textarea{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical;min-height:60px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(46,109,180,.15)}
  .filebox{border:1.5px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer}
  .filebox:hover{border-color:var(--blue2);color:var(--blue)}
  .btn{border:0;border-radius:8px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .btn.primary{background:var(--blue);color:#fff}.btn.primary:disabled{background:#b6c2d1;cursor:not-allowed}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}
  .btn.ok{background:var(--ok);color:#fff}.btn.warn{background:var(--warn);color:#fff}
  .btn.purple{background:var(--purple);color:#fff}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn.xs{padding:3px 9px;font-size:12px}
  .row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
  table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tb th,table.tb td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:middle}
  table.tb th{background:var(--blue);color:#fff;font-weight:600}
  table.tb tr:nth-child(even) td{background:#fafbfc}
  table.tb.matrix td,table.tb.matrix th{text-align:center;padding:6px}
  input[type=checkbox]{width:17px;height:17px;cursor:pointer;accent-color:var(--blue)}
  .pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
  .pill.wait{background:var(--amberbg);color:var(--amber)}.pill.ok{background:var(--okbg);color:var(--ok)}
  .pill.no{background:var(--warnbg);color:var(--warn)}.pill.up{background:var(--okbg);color:var(--ok)}
  .pill.info{background:var(--blue-l);color:var(--blue)}.pill.purple{background:var(--purplebg);color:var(--purple)}
  .kpi{display:flex;align-items:baseline;gap:8px}.kpi .n{font-size:28px;font-weight:800;color:var(--blue)}.kpi .l{font-size:13px;color:var(--muted)}
  .progress{height:9px;background:#eef0f3;border-radius:6px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:var(--ok)}
  .toast{position:fixed;right:20px;bottom:20px;background:#222d3a;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;transform:translateY(10px);transition:.25s;z-index:60;max-width:360px}
  .toast.show{opacity:1;transform:none}
  .scoreitem{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .scoreitem.bad{border-color:#f0c2bc;background:#fffafa}
  .scoreitem .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
  .scoreitem .hd b{font-size:14px}.scoreitem .max{font-size:12px;color:var(--muted);white-space:nowrap}
  .scoregrid{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:start}
  @media(max-width:640px){.scoregrid{grid-template-columns:1fr}}
  .files-mini{font-size:12px;color:var(--muted);margin:2px 0 8px}
  .files-mini a{color:var(--blue2);cursor:pointer;text-decoration:underline;margin-right:8px}
  .err{color:var(--warn);font-size:12.5px;margin-top:4px;display:none}.err.show{display:block}
  .timetable{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}
  .timetable th,.timetable td{border:1px solid var(--line);padding:0;text-align:center}
  .timetable th{background:var(--blue-l);color:var(--blue);padding:5px 2px;font-weight:600}
  .timetable td .slot{padding:8px 2px;cursor:pointer;user-select:none}
  .timetable td .slot:hover{background:var(--blue-l)}.timetable td .slot.sel{background:var(--blue);color:#fff}
  .muted{color:var(--muted)}.hidden{display:none}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .src{font-size:11.5px;color:var(--muted);margin-top:8px}.src a{color:var(--blue2)}
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 16px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .modal-bg{position:fixed;inset:0;background:rgba(20,28,38,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal{background:#fff;border-radius:14px;max-width:600px;width:100%;max-height:86vh;overflow:auto;padding:22px}
  .modal h3{margin:0 0 8px;color:var(--blue)}
  .acctbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px}
  .reflect-row{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:8px;margin-bottom:8px;align-items:start}
  @media(max-width:760px){.reflect-row{grid-template-columns:1fr}}
  /* v6 新增：上傳中 spinner */
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:4px}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* v6 新增：手機版表格轉卡片式（max-width:760px） */
  @media(max-width:760px){
    #main table.tb thead{display:none}
    #main table.tb,#main table.tb tbody,#main table.tb tr,#main table.tb td{display:block;width:100%}
    #main table.tb tr{margin-bottom:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
    #main table.tb tr:nth-child(even) td{background:#fff}
    #main table.tb td{border:none;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:14px;text-align:right;padding:9px 12px}
    #main table.tb td:last-child{border-bottom:none}
    #main table.tb td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;flex:0 0 38%}
    #main table.tb td:empty{display:none}
  }
  /* 列印：隱藏導覽列、頁籤與按鈕，只印乾淨表格 */
  @media print{
    header.top,nav.side,.roleswitch,.tabs,.btn,.row-actions,.toast,#modal,.acctbar{display:none!important}
    .wrap{display:block}main{max-width:none;padding:0}
    .card{border:none;box-shadow:none;padding:0;margin:0 0 10px}
  }
</style>
</head>
<body>
<header class="top">
  <div class="logo">🎓 國立臺灣科技大學　社團管理系統</div>
  <div class="roleswitch" id="roleSwitch">
    <button data-role="club" class="on">社團端</button>
    <button data-role="viewer">評審端</button>
    <button data-role="admin">管理員端</button>
  </div>
</header>
<div class="wrap"><nav class="side" id="side"></nav><main id="main"></main></div>
<div class="toast" id="toast"></div>
<div id="modal"></div>
<script>

/* ===== 競賽獎項與評分表 ===== */
const AD_RUBRIC=[
  {key:"ad1",grp:"(一) 活動及社課申請 15%",name:"活動及社課申請",max:15,help:"一次1分，一天最多一次，大型活動3分，結案始算"},
  {key:"ad2",grp:"(二) 活動/社課成果 60%",name:"照片/影片",max:15,help:"每活動≥5張照片或影片連結1分，大型3分"},
  {key:"ad3",grp:"(二) 活動/社課成果 60%",name:"成果單",max:15,help:"每活動1分，大型3分"},
  {key:"ad4",grp:"(二) 活動/社課成果 60%",name:"心得回饋",max:30,help:"每活動2分，大型6分"},
  {key:"ad5",grp:"(三) 社團資料更新 15%",name:"社員、幹部名單更新",max:10,help:"定期更新；10人以上每學期5分"},
  {key:"ad6",grp:"(三) 社團資料更新 15%",name:"社團網頁經營",max:5,help:"有連結1分、資訊更新4分"},
  {key:"ad7",grp:"(四) 參與會議與活動 10%",name:"負責人會議",max:5,help:"一年出席負責人會議滿4次得5分"},
  {key:"ad8",grp:"(四) 參與會議與活動 10%",name:"幹訓",max:5,help:"派幹部全程參與5分"},
];
const OP_RUBRIC=[
  {key:"o1",grp:"組織運作及財務管理 50%",name:"管理運作（章程、傳承交接）",max:15,help:"組織章程、社員大會、幹部交接"},
  {key:"o2",grp:"組織運作及財務管理 50%",name:"規劃管理",max:10,help:"社員大會、幹部會議、行事曆、年度計畫"},
  {key:"o3",grp:"組織運作及財務管理 50%",name:"財務管理",max:25,help:"經費運作、帳本、財報、器材管理"},
  {key:"a1",grp:"社團活動績效 50%",name:"社內活動",max:15,help:"活動檢討、社課紀錄、參與率"},
  {key:"a2",grp:"社團活動績效 50%",name:"社團融入 SDGs",max:10,help:"活動融入 SDGs 目標"},
  {key:"a3",grp:"社團活動績效 50%",name:"社會實踐",max:15,help:"社會實踐與校外參與"},
  {key:"a4",grp:"社團活動績效 50%",name:"活動特色",max:10,help:"主題創新、結合關注議題"},
];
const FIN_RUBRIC=[
  {key:"f1",grp:"制度 20%",name:"財務管理制度",max:20,help:"訂有財務管理辦法、使用原則及運作"},
  {key:"f2",grp:"預算 30%",name:"預算編列、審核",max:15,help:"年度預算表、審核會議、審核證明"},
  {key:"f3",grp:"預算 30%",name:"經費應變、開源節流",max:15,help:"彈性經費、應變措施、開源節流做法"},
  {key:"f4",grp:"帳目與支出憑證 25%",name:"帳目交接",max:10,help:"新舊負責人/總務蓋章與交接紀錄"},
  {key:"f5",grp:"帳目與支出憑證 25%",name:"總帳登記、支出憑證製作",max:15,help:"帳冊編碼、社章、抬頭、單據、審核"},
  {key:"f6",grp:"公開徵信 25%",name:"帳目核對、公開徵信",max:25,help:"收支公告、查帳紀錄、專戶存簿印章分管"},
];
const ACTV_RUBRIC=[
  {key:"ac1",grp:"活動企劃 25%",name:"活動會議",max:10,help:"討論/籌備會議效率、通知議程簽到紀錄"},
  {key:"ac2",grp:"活動企劃 25%",name:"活動企劃",max:15,help:"企劃書、進度規劃、申請書、特色主題、經費"},
  {key:"ac3",grp:"活動執行 35%",name:"活動前",max:10,help:"工作人員招募、場佈、美宣"},
  {key:"ac4",grp:"活動執行 35%",name:"活動中",max:15,help:"器材道具、細流動線、工作職責"},
  {key:"ac5",grp:"活動執行 35%",name:"活動後",max:5,help:"場地復原、器材歸還"},
  {key:"ac6",grp:"活動執行 35%",name:"經費運用",max:5,help:"經費來源運作、財務辦法、效益評估"},
  {key:"ac7",grp:"活動結案 30%",name:"成效評估",max:10,help:"問卷回饋分析、活動剪影、器材經費對照"},
  {key:"ac8",grp:"活動結案 30%",name:"資料保存",max:5,help:"資料完整電腦化、紀錄詳實、指導老師簽名"},
  {key:"ac9",grp:"活動結案 30%",name:"活動檢討",max:15,help:"檢討會、優缺點分析、傳承、心得"},
];
const RESULT_RUBRIC=[
  {key:"r1",grp:"活動影響力 20%",name:"觸及與效益",max:7,help:"參與人數相符、來源多元、觸及核心需求"},
  {key:"r2",grp:"活動影響力 20%",name:"學習獲得",max:7,help:"學會新技能/知識、對未來有實際幫助"},
  {key:"r3",grp:"活動影響力 20%",name:"持續效應",max:6,help:"延續性、被推廣複製、後續行動"},
  {key:"r4",grp:"執行完整度 40%",name:"規劃合理性",max:10,help:"企畫合理、目標明確、分工清楚、流程合理"},
  {key:"r5",grp:"執行完整度 40%",name:"現場執行流暢",max:10,help:"活動進行順利"},
  {key:"r6",grp:"執行完整度 40%",name:"執行與紀錄",max:10,help:"照片證明、紀錄完整品質良好"},
  {key:"r7",grp:"執行完整度 40%",name:"問題解決與應變",max:10,help:"突發狀況妥善處理"},
  {key:"r8",grp:"學習與成長 20%",name:"團隊學習收穫",max:10,help:"技能、經驗、反思"},
  {key:"r9",grp:"學習與成長 20%",name:"改進計畫",max:10,help:"具體可行的改善方向"},
  {key:"r10",grp:"現場發表 20%",name:"現場成果發表(7分鐘)",max:20,help:"投入程度、表達清晰、真誠熱情"},
];
const LEADER_RUBRIC=[
  {key:"l1",grp:"自我介紹 25%",name:"自我介紹",max:10,help:"基本資料、履歷、自傳、優缺點、受推薦原因"},
  {key:"l2",grp:"自我介紹 25%",name:"人生規劃",max:5,help:"短中長期目標、未來規劃"},
  {key:"l3",grp:"自我介紹 25%",name:"個人特色",max:10,help:"人格特質、自身獨特性"},
  {key:"l4",grp:"社團經歷 45%",name:"社團經歷",max:20,help:"負責工作經驗、感想"},
  {key:"l5",grp:"社團經歷 45%",name:"社團事蹟及貢獻",max:25,help:"社團事蹟貢獻、寒暑假服務隊貢獻"},
  {key:"l6",grp:"個人事蹟 30%",name:"個人目標",max:10,help:"個人目標是否達成"},
  {key:"l7",grp:"個人事蹟 30%",name:"活動經歷",max:15,help:"負責工作經驗、感想"},
  {key:"l8",grp:"個人事蹟 30%",name:"人際經歷",max:5,help:"社團內人際交往、感想"},
];
const AWARDS=[
  {id:"club",name:"最佳社團獎",type:"團體",weighted:true,
    groups:[{label:"行政資料",weight:0.4,rubric:AD_RUBRIC},{label:"社團營運",weight:0.6,rubric:OP_RUBRIC}]},
  {id:"finance",name:"最佳財務獎",type:"團體",rubric:FIN_RUBRIC,present:true},
  {id:"activity",name:"最佳活動獎",type:"團體",rubric:ACTV_RUBRIC,present:true},
  {id:"result",name:"最佳成果發表獎",type:"團體",rubric:RESULT_RUBRIC},
  {id:"leader",name:"最佳社團負責人獎",type:"個人",rubric:LEADER_RUBRIC,present:true},
];
function awardById(id){return AWARDS.find(a=>a.id===id);}
/* 最佳活動獎／財務獎／社團負責人獎：評分表占 80%，活動當日現場簡報占 20%（滿分 20） */
function hasPresentation(awardId){const a=awardById(awardId);return !!(a&&a.present);}
function awardItems(a){return a.weighted?[].concat(...a.groups.map(g=>g.rubric)):a.rubric;}
function gradeOf(pct){return pct>=90?"A+":pct>=80?"A":pct>=70?"B":pct>=60?"C":"D";}

/* 示範社團清單：原系學會（皆自治性）＋各性質代表社團，性質取自《社團分類》正確值 */
let CLUBS=["資工系學會","電機系學會","機械系學會","化工系學會","學生會","畢聯會","電子系學會","企管系學會","機器人研究社","Cosplay社","國際志工社","美術社","網球社"];
const ATTRS=["自治性","學藝性","服務性","聯誼性","藝術性","體育性"];

/* v6 新增：手機版表格自動填入 data-label（依表頭文字） */
function applyTableLabels(){$$("#main table.tb").forEach(tb=>{const ths=[...tb.querySelectorAll("thead th")].map(th=>th.textContent.trim());if(!ths.length)return;tb.querySelectorAll("tbody tr").forEach(tr=>{const tds=tr.querySelectorAll("td");if(tds.length!==ths.length)return;tds.forEach((td,i)=>{if(ths[i])td.setAttribute("data-label",ths[i]);});});});}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800);}
function esc(s){return (s==null?"":""+s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function opt(arr,sel){return arr.map(a=>`<option ${a===sel?"selected":""}>${esc(a)}</option>`).join("");}
function today(){const d=new Date();return d.getFullYear()+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+String(d.getDate()).padStart(2,"0");}
function nowTime(){const d=new Date();return today()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");}
/* 學期區間自動判定：2/1–7/31 為上學期、8/1–隔年1/31 為下學期 */
function semesterOf(dateStr){if(!dateStr)return "";const p=(""+dateStr).replace(/-/g,"/").split("/");const m=parseInt(p[1],10);if(!m||m<1||m>12)return "";return (m>=2&&m<=7)?"上學期":"下學期";}

function modal(html){$("#modal").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}<div class="row-actions" style="margin-top:14px;justify-content:flex-end"><button class="btn ghost" onclick="closeModal()">關閉</button></div></div></div>`;}
function closeModal(){$("#modal").innerHTML="";}
/* CSV 以 UTF-8 BOM 輸出，Excel 開啟不會亂碼 */
function csvCell(v){v=(v==null?"":""+v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function download(name,content){try{const isCsv=/\.csv$/i.test(name);const data=isCsv?String.fromCharCode(0xFEFF)+content:content;const b=new Blob([data],{type:isCsv?"text/csv;charset=utf-8":"text/plain;charset=utf-8"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(e){}toast("已產生並下載："+name);}
function adminIsSuper(){const a=ADMINS.find(x=>x.id===state.adminUser);return a&&a.super;}
function curV(){return VIEWERS.find(v=>v.id===state.curViewer)||VIEWERS[0];}
function addFile(club,key,fn){state.docs[club]=state.docs[club]||{};(state.docs[club][key]=state.docs[club][key]||[]).push(fn);}

  if(adminIsSuper()){base.push({g:"最高權限專屬"},{k:"aresource",t:"🏫 教室／器材與手動借用"},{k:"asusp",t:"⛔ 逾期追蹤與停權管理"},{g:"機密"},{k:"sscore",t:"🏆 競賽成績總表"},{k:"aaudit",t:"📜 稽核軌跡"});return base;}
  /* 權限與審核優化新增：非最高權限者依 permissions 過濾選單，並移除空群組 */
  const me=ADMINS.find(x=>x.id===state.adminUser);const perms=(me&&me.permissions)||[];
  const allow=k=>k==="ahome"||perms.includes(k);
  const kept=base.filter(n=>n.g||allow(n.k));
  const out=[];for(let i=0;i<kept.length;i++){if(kept[i].g){if(i+1<kept.length&&!kept[i+1].g)out.push(kept[i]);}else out.push(kept[i]);}

function render(){
  if(!state.loggedIn){renderLogin();return;}
  renderUserbox();
  const nav=state.role==="admin"?adminNav():NAV[state.role];
  if(page[state.role]&&!nav.some(n=>n.k===page[state.role]))page[state.role]=nav.find(n=>n.k).k;
  $("#side").innerHTML=nav.map(n=>{
    if(n.g)return `<div class="grp">${n.g}</div>`;
    const cur=page[state.role]===n.k;let dot="";
    if(n.k==="aact"){const c=state.activities.filter(a=>isActPending(a.status)||a.status==="待審核").length;if(c)dot=`<span class="dot">${c}</span>`;}
    if(n.k==="aclose"){const c=state.activities.filter(a=>isClosePending(a.status)||a.status==="結案待審").length;if(c)dot=`<span class="dot">${c}</span>`;}
    if(n.k==="aapply"){const c=state.applications.filter(a=>a.status==="待審").length;if(c)dot=`<span class="dot">${c}</span>`;}
    if(n.k==="amaint"){const c=state.applications.filter(a=>a.type==="社團活動空間維修"&&(a.status==="待處理"||a.status==="處理中")).length;if(c)dot=`<span class="dot">${c}</span>`;}
    return `<a data-k="${n.k}" class="${cur?'on':''}">${n.t}${dot}</a>`;
  }).join("");
  $$("#side a").forEach(a=>a.onclick=()=>{page[state.role]=a.dataset.k;render();});
  const p=page[state.role];
  let bar="";
  if(state.role==="admin"){
    bar=`<div class="card acctbar"><span style="font-size:13px;color:var(--muted)">目前登入管理員：</span>
      <select id="adminSel" style="width:auto;padding:5px 9px">${ADMINS.map(a=>`<option value="${a.id}" ${a.id===state.adminUser?'selected':''}>${esc(a.name)}</option>`).join("")}</select>
      <span style="font-size:12px;color:var(--muted);margin-left:auto">示範：可切換帳號體驗不同管理員畫面</span></div>`;
  }
  if(state.role==="viewer"){const v=curV();
    bar=`<div class="card acctbar"><span style="font-size:13px;color:var(--muted)">目前登入評審老師：</span>
      <select id="viewerSelTop" style="width:auto;padding:5px 9px">${VIEWERS.map(v2=>`<option value="${v2.id}" ${v2.id===state.curViewer?'selected':''}>${esc(v2.name)}</option>`).join("")}</select>
      ${v.canViewEval?'<span class="pill ok">可檢視社團資料</span>':'<span class="pill no">未開放檢視社團資料</span>'}
      <span style="font-size:12px;color:var(--muted);margin-left:auto">負責獎項：${v.awards.map(id=>esc(awardById(id).name)).join("、")||"（未指派）"}</span></div>`;
  }
  $("#main").innerHTML=bar+(PAGES[state.role][p]||(()=>"<div class='card'>—</div>"))();
  const asel=$("#adminSel");if(asel)asel.onchange=()=>{state.adminUser=asel.value;render();};
  const vsel=$("#viewerSelTop");if(vsel)vsel.onchange=()=>{state.curViewer=vsel.value;const v=curV();vAward=v.awards[0]||"club";render();};
  if(AFTER[p])AFTER[p]();
  applyTableLabels(); /* v6 新增 */
  if(typeof persistSave==="function")persistSave(); /* 每次重繪後存檔 */
}

/* 權限與審核優化新增：經費逐項編列／核定 */
const BUDGET_CATS=["指導老師/教練費","演講/裁判費","保險費","交通費","印刷費","比賽獎勵品","其他"];
function budgetList(a){return a.budgetItems||[];}
function sumSelf(a){return budgetList(a).reduce((t,b)=>t+(+b.selfFund||0),0);}
function sumReq(a){return budgetList(a).reduce((t,b)=>t+(+b.reqSubsidy||0),0);}
function sumApproved(a){return budgetList(a).reduce((t,b)=>t+(b.approved!=null?+b.approved:0),0);}
let budgetSeq=1;
AFTER.actapply=()=>{const b=$("#budgetBody");if(b&&!b.children.length)addBudgetRow();budgetRecalc();};
function budgetRowHtml(){const id="br"+(budgetSeq++);return `<tr data-row="${id}"><td><select class="bg-cat">${opt(BUDGET_CATS,"指導老師/教練費")}</select></td><td><input type="text" class="bg-desc" placeholder="使用經費說明"></td><td><input type="number" class="bg-self" min="0" placeholder="0" style="width:100px" oninput="budgetRecalc()"></td><td><input type="number" class="bg-req" min="0" placeholder="0" style="width:100px" oninput="budgetRecalc()"></td><td><button class="btn warn xs" onclick="this.closest('tr').remove();budgetRecalc()">刪除</button></td></tr>`;}
function addBudgetRow(){const b=$("#budgetBody");if(b)b.insertAdjacentHTML("beforeend",budgetRowHtml());budgetRecalc();}
function budgetRecalc(){let s=0,r=0;$$("#budgetBody tr").forEach(tr=>{s+=+(tr.querySelector(".bg-self").value||0);r+=+(tr.querySelector(".bg-req").value||0);});if($("#bt_self"))$("#bt_self").textContent="$"+s.toLocaleString();if($("#bt_req"))$("#bt_req").textContent="$"+r.toLocaleString();}
function gatherBudget(){return $$("#budgetBody tr").map(tr=>({id:tr.dataset.row,category:tr.querySelector(".bg-cat").value,description:tr.querySelector(".bg-desc").value.trim(),selfFund:+(tr.querySelector(".bg-self").value||0),reqSubsidy:+(tr.querySelector(".bg-req").value||0),approved:null}));}
function submitActivity(){
  const name=$("#ac_name").value.trim(),type=$("#ac_type").value,date=$("#ac_date").value;
  const budgetItems=gatherBudget().filter(b=>b.selfFund>0||b.reqSubsidy>0||b.description);
  if(!name||!type||!date||!budgetItems.length){$("#ac_err").classList.add("show");return;}
  state.activities.push({id:state.seq++,club:state.club,name,type,date:date.replace(/-/g,"/"),timeRange:$("#ac_time").value.trim(),location:$("#ac_loc").value.trim(),pIn:+($("#ac_pin").value||0),pOut:+($("#ac_pout").value||0),content:$("#ac_content").value.trim(),work:$("#ac_work").value.trim(),budgetItems:budgetItems,fund:null,schoolApproved:null,status:ACT_STAGES[0],note:"",report:null}); /* 權限與審核優化新增：budgetItems */
  toast("活動申請已送出，等待管理員審核");go("actlist");
}

/* 社團端：自行刪除活動（填錯或活動未舉辦）；僅能刪除自己社團的活動，刪除含其結案資料且無法復原 */
function deleteActivity(id){const a=state.activities.find(x=>x.id===id);if(!a)return;if(a.club!==state.club){toast("僅能刪除本社團的活動");return;}if(typeof confirm==="function"&&!confirm(`確定刪除活動「${a.name}」？刪除後無法復原（含已填的結案資料）。`))return;state.activities=state.activities.filter(x=>x.id!==id);toast("已刪除活動："+a.name);render();}
PAGES.club.actclose=()=>{
  const acts=state.activities.filter(a=>a.club===state.club&&(a.status==="已核准"||a.status==="已退回"));

/* 夜間防佔用規則（可調整）：夜間節次＝第10、A、B、C、D節 */

function submitRoom(){if(!roomFixWin().open){toast("固定借用登記目前未開放，請改用「場地借用申請」辦理臨時借用");return;}const room=$("#r_room").value;const entries=gatherRoomEntries();if(!room||!entries.length){$("#r_err").classList.add("show");return;}
  /* 夜間防佔用：以「本社團本期間所有有效登記（待審＋已核准）＋本次」累計計算，避免分多次送出規避 */
  const newNight=entries.filter(e=>NIGHT_SLOTS.has(e.period));
  const existNight=clubNightEntries(state.club);
  const allNight=existNight.concat(newNight);
  if(allNight.length>NIGHT_SLOT_LIMIT){toast("⛔ 夜間借用防呆：夜間節次（第10、A、B、C、D節）本期間累計不得超過 "+NIGHT_SLOT_LIMIT+" 節（已登記 "+existNight.length+" 節＋本次 "+newNight.length+" 節＝"+allNight.length+" 節），請調整或先取消既有登記。");return;}
  const allNightDays=new Set(allNight.map(e=>e.date));
  if(allNightDays.size>NIGHT_DAY_LIMIT){toast("⛔ 夜間借用防呆：含夜間節次之借用日期本期間累計最多 "+NIGHT_DAY_LIMIT+" 天（防分散佔用），含本次後累計 "+allNightDays.size+" 天，請減少夜間借用天數。");return;}

PAGES.admin.aroom=()=>{
  const bs=state.roomBookings;
  const slotMap={};bs.forEach(b=>{if(b.status==='待審')(b.entries||[]).forEach(e=>{const key=b.room+"|"+e.date+"|"+e.period;(slotMap[key]=slotMap[key]||[]).push(b.club);});});
  const rows=bs.length?bs.slice().reverse().map(b=>{
    const conflict=b.status==='待審'&&(b.entries||[]).some(e=>(slotMap[b.room+"|"+e.date+"|"+e.period]||[]).length>1);

function roomDecide(id,status){const b=state.roomBookings.find(x=>x.id===id);if(!b)return;
  if(status==='已核准'){
    /* 防雙重核准：同教室、同日期、同節次若已有他社獲准，阻擋本次核准 */
    const clash=[];
    (b.entries||[]).forEach(e=>{const holder=state.roomBookings.find(x=>x.id!==b.id&&x.status==='已核准'&&x.room===b.room&&x.club!==b.club&&(x.entries||[]).some(e2=>e2.date===e.date&&e2.period===e.period));if(holder)clash.push(entryLabel(e)+"（已由 "+holder.club+" 取得）");});
    if(clash.length){toast("⛔ 無法核准「"+esc(b.room)+"」：下列時段已由其他社團獲准，請改核准其他社團或調整："+clash.join("、"));return;}
  }
  if(status==='未核准'){const r=requireReason("不核准原因（必填）：","該時段已由其他社團取得");if(r===null)return;b.note=(b.note?b.note+'｜':'')+'未核准：'+r;}
  b.status=status;audit("固定借用審核",b.club+"／"+esc(b.room)+" → "+status);toast(`#${id} 教室登記 → ${status}`);render();}

function delItemFile(key,fn){const d=state.docs[state.club];if(!d||!d[key])return;d[key]=d[key].filter(x=>x!==fn);if(!d[key].length)delete d[key];toast("已刪除："+fn);render();}

/* ===== 最佳社團獎－行政資料 系統自動評分 ===== */
function signupConfirmed(club,itemId){const s=state.signups.find(x=>x.club===club);return !!(s&&s.confirmed&&s.confirmed[itemId]);}
/* 場次出席計數：sessionAttend[itemId][club] 內為 true 的場次數 */
function attendedCount(itemId,club){const m=state.sessionAttend&&state.sessionAttend[itemId]&&state.sessionAttend[itemId][club];if(!m)return 0;return Object.keys(m).filter(k=>m[k]).length;}
function sessionAttended(itemId,club,sid){return !!(state.sessionAttend&&state.sessionAttend[itemId]&&state.sessionAttend[itemId][club]&&state.sessionAttend[itemId][club][sid]);}
function computeAdminScore(club){
  const acts=state.activities.filter(a=>a.club===club);
  const big=a=>a.type==="大型活動";
  const cap=(v,m)=>Math.min(v,m);
  const fl=k=>fileList(club,k).length;
  const d={};
  d.ad1=cap(acts.reduce((s,a)=>s+(big(a)?3:1),0),15);
  /* ad2(相片)/ad3(成果)/ad4(心得)：須經輔導老師結案檢核且「該分項」被勾選確認才採計，逐項獨立；未勾選一律 0 分 */
  const advc=a=>(a.report&&a.report.advisorConfirmed)||{};
  d.ad2=cap(acts.filter(a=>advc(a).photos&&(a.report.photos||a.report.video)).reduce((s,a)=>s+(big(a)?3:1),0),15);
  d.ad3=cap(acts.filter(a=>advc(a).result).reduce((s,a)=>s+(big(a)?3:1),0),15);
  let refl=0;acts.forEach(a=>{if(advc(a).reflection&&a.report.reflections)refl+=a.report.reflections.length*(big(a)?6:2);});
  d.ad4=cap(refl,30);
  /* ad5 名單更新：與統計頁採同一人數來源 memberCount（10人以上每學期5、總分10；9人以下每學期2.5） */
  d.ad5=(function(){const mc=memberCount(club);return mc>=10?10:(mc>=1?5:0);})();
  d.ad6=fl("ad6")?5:0;
  /* ad7：社團負責人會議（s1）累計實際參與場次達 4 場（含）給滿分 5 分 */
  d.ad7=(attendedCount("s1",club)>=4)?5:0;
  d.ad8=signupConfirmed(club,"s2")?5:0;
  const base=AD_RUBRIC.reduce((acc,it)=>acc+(d[it.key]||0),0);
  const vpenalty=state.violations.filter(v=>v.club===club&&v.status!=="已銷案").length;
  const autoTotal=Math.max(0,base-vpenalty);
  const ov=state.scoreOverride[club]; /* v6 手動調整 */
  const total=(ov&&ov.value!==''&&ov.value!=null)?ov.value:autoTotal;
  return {detail:d,total,base,vpenalty,autoTotal,override:ov||null};
}
/* v6 修改：支援手動調整(Override)；opts.admin 顯示調整介面 */
function adminScoreCard(club,opts){opts=opts||{};
  const r=computeAdminScore(club);const detail=r.detail;const total=r.total;
  const overridden=r.override&&r.override.value!==''&&r.override.value!=null;
  const rows=AD_RUBRIC.map(it=>{
    const got=detail[it.key]||0;const pct=Math.round(got/it.max*100);
    return `<tr><td style="text-align:left">${esc(it.name)}<div class="muted" style="font-size:11px">${esc(it.help||"")}</div></td><td>${it.max}</td><td><b style="color:var(--blue)">${got}</b></td><td><div class="progress" style="margin:0"><i style="width:${pct}%"></i></div></td></tr>`;
  }).join("");
  const weighted=(total*0.4).toFixed(1);
  return `<div class="card">
    <h2>最佳社團獎－行政資料　系統自動評分 <span class="tag">占最佳社團獎 40%</span></h2>
    <div class="note blue" style="margin-bottom:12px">本分數由系統依「活動申請、活動結案成果、心得回饋、資料上傳、會議／幹訓實際參與確認」等資料 <b>自動判斷給分</b>（滿分 100）。「負責人會議」與「幹訓」兩項，須由承辦人於活動結束後在「報名管理」確認社團<b>實際參與</b>後才採計；<b>照片／成果／心得三項須經輔導老師結案檢核確認後才採計</b>；最終成績仍以學務處審核確認為準。</div>
    <div class="grid g3" style="margin-bottom:12px">
      <div class="card" style="margin:0"><div class="kpi"><span class="n">${total}</span><span class="l">行政資料總分 / 100${overridden?'（已手動調整）':''}</span></div></div>
      <div class="card" style="margin:0"><div class="kpi"><span class="n">${weighted}</span><span class="l">加權後（×40%）</span></div></div>
      <div class="card" style="margin:0"><div class="kpi"><span class="n">${gradeOf(total)}</span><span class="l">等第</span></div></div>
    </div>
    ${r.vpenalty?`<div class="note" style="margin-bottom:12px">⚠️ 公共空間違規未銷案 <b>${r.vpenalty}</b> 筆，已自基本分 ${r.base} 扣 ${r.vpenalty} 分（每筆 1 分）；完成愛校服務銷案後即恢復。</div>`:''}
    ${overridden?`<div class="note">📝 本分數經管理員手動調整為 <b>${total}</b> 分（系統自動計算為 ${r.autoTotal} 分）${r.override.note?`；備註：${esc(r.override.note)}`:''}</div>`:''}
    <table class="tb"><thead><tr><th style="text-align:left">評分細項</th><th style="width:60px">配分</th><th style="width:80px">系統給分</th><th style="width:160px">達成度</th></tr></thead><tbody>${rows}</tbody></table>
    ${opts.admin?`<div class="note purple" style="margin:14px 0 0">
      <div style="font-weight:700;margin-bottom:8px">🛠️ 手動調整分數（Override）</div>
      <div class="grid g2">
        <label class="f" style="margin:0"><span class="lab">調整後總分（0–100，留空＝採系統分 ${r.autoTotal}）</span><input type="number" min="0" max="100" id="ov_val" value="${overridden?total:''}" placeholder="系統分 ${r.autoTotal}"></label>
        <label class="f" style="margin:0"><span class="lab">調整備註</span><input type="text" id="ov_note" value="${r.override&&r.override.note?esc(r.override.note):''}" placeholder="例：補件後酌予調整"></label>
      </div>
      <div class="row-actions" style="margin-top:8px"><button class="btn primary sm" onclick="saveOverride('${esc(club)}')">儲存調整</button>${overridden?`<button class="btn ghost sm" onclick="clearOverride('${esc(club)}')">清除調整（回系統分）</button>`:''}</div>
    </div>`:''}
  </div>`;
}
function saveOverride(club){const ev=$("#ov_val"),en=$("#ov_note");const v=ev?ev.value.trim():"";const note=en?en.value.trim():"";state.scoreOverride[club]={value:v===''?'':+v,note:note};audit("手改行政資料分數",club+" → "+(v===''?'回系統分':v)+(note?'｜備註：'+note:''));notifyEmail(club+" 行政資料分數經管理員調整為 "+(v===''?'（回系統分）':v));toast(club+" 行政分數調整已儲存");render();adocDetail(club);}

const AD_KEYS=AD_RUBRIC.map(r=>r.key), OP_KEYS=OP_RUBRIC.map(r=>r.key);
/* 由評分紀錄的 items 即時計算換算分數（不依賴存下的 pct，rubric 改了會自動反映） */
function scorePct(s){if(!s)return 0;const a=awardById(s.award);if(!a)return +s.pct||0;
  if(a.weighted){const adSum=AD_KEYS.reduce((t,k)=>t+((s.items&&s.items[k]&&+s.items[k].score)||0),0);const opSum=OP_KEYS.reduce((t,k)=>t+((s.items&&s.items[k]&&+s.items[k].score)||0),0);const adT=Math.max(0,Math.min(100,adSum+(+s.bonus||0)-(+s.penalty||0)));return adT*0.4+opSum*0.6;}
  const items=awardItems(a);const rmax=items.reduce((t,it)=>t+it.max,0)||1;const sum=items.reduce((t,it)=>t+((s.items&&s.items[it.key]&&+s.items[it.key].score)||0),0);const base=sum/rmax*100;return a.present?(base*0.8+(+s.present||0)):base;}
function savedScore(club,awardId,vid){return state.scores.find(s=>s.club===club&&s.award===awardId&&s.viewer===vid);}

/* v6 新增：評審草稿自動暫存（localStorage） */
function draftKey(club,award,vid){return "ntust_vscore_draft_"+vid+"_"+award+"_"+club;}
function loadDraft(club,award,vid){try{const r=localStorage.getItem(draftKey(club,award,vid));return r?JSON.parse(r):null;}catch(e){return null;}}
function saveDraft(){try{if(!$(".sc-score"))return;const v=curV();const items={};let hasData=false;$$(".sc-score").forEach(se=>{const k=se.dataset.key;const ce=$(`.sc-cmt[data-key="${k}"]`);const sc=se.value,cm=ce?ce.value:"";if(sc!==""||cm!=="")hasData=true;items[k]={score:sc,comment:cm};});if(!hasData)return;const obj={items,bonus:$("#v_bonus")?$("#v_bonus").value:0,penalty:$("#v_penalty")?$("#v_penalty").value:0,present:$("#v_present")?$("#v_present").value:0,time:Date.now()};localStorage.setItem(draftKey(state.scoreClub,vAward,v.id),JSON.stringify(obj));const ind=$("#v_draft");if(ind)ind.textContent="✅ 已自動暫存草稿 "+new Date().toLocaleTimeString();}catch(e){}}
function clearDraft(club,award,vid){try{localStorage.removeItem(draftKey(club,award,vid));}catch(e){}}
function gatherScore(){
  const a=awardById(vAward);const items=awardItems(a);let allValid=true,filled=0,bad={};const sc={};
  items.forEach(it=>{const se=$(`.sc-score[data-key="${it.key}"]`),ce=$(`.sc-cmt[data-key="${it.key}"]`);const sv=se?se.value.trim():"",cv=ce?ce.value.trim():"";const num=parseFloat(sv);const sOk=sv!==""&&!isNaN(num)&&num>=0&&num<=it.max;const cOk=cv.length>=10;sc[it.key]={score:sOk?num:0,comment:cv};if(sOk&&cOk)filled++;else{allValid=false;bad[it.key]={sOk,cOk};}});
  let pct,present=0;
  if(a.weighted){const adSum=AD_KEYS.reduce((t,k)=>t+(sc[k]?sc[k].score:0),0);const opSum=OP_KEYS.reduce((t,k)=>t+(sc[k]?sc[k].score:0),0);const bonus=+($("#v_bonus")?$("#v_bonus").value:0)||0,pen=+($("#v_penalty")?$("#v_penalty").value:0)||0;let adT=Math.max(0,Math.min(100,adSum+bonus-pen));pct=adT*0.4+opSum*0.6;}
  else{const sum=items.reduce((t,it)=>t+(sc[it.key]?sc[it.key].score:0),0);const max=items.reduce((t,it)=>t+it.max,0);const base=max?sum/max*100:0;
    if(a.present){present=Math.max(0,Math.min(20,+($("#v_present")?$("#v_present").value:0)||0));pct=base*0.8+present;} /* 評分表80%＋現場簡報20% */
    else pct=base;}
  return {allValid,filled,bad,pct,items:sc,total:items.length,present};
}
function liveTotal(){const g=gatherScore();if($("#v_pct"))$("#v_pct").textContent=g.pct.toFixed(1);if($("#v_grade"))$("#v_grade").innerHTML=gradePill(g.pct);if($("#v_filled"))$("#v_filled").textContent=g.filled;if($("#v_submit"))$("#v_submit").disabled=!g.allValid;saveDraft(); /* v6 自動暫存 */}
function submitScore(){

}

  return `<h1 class="page">活動申請審核</h1><p class="sub"><b>有申請經費</b>（擬請補助＞0）：三關簽核 待輔導老師 → 待組長 → 待學務長；<b>無申請經費</b>：輔導老師通過即核准。第一關（輔導老師）認定經費來源與核定金額；點活動名稱或「檢視詳情」可看完整內容</p>

  if(a.status==="已核准")h+='<div class="row-actions" style="margin-top:12px"><button class="btn primary" onclick="genApplicationForm('+a.id+')">📄 產生社團活動申請表(PDF)</button></div>'; /* 結案資料優化新增 */

/* 權限與審核優化新增：輔導老師關卡認定經費（下拉或自行輸入） */
function actApprove(id){const a=state.activities.find(x=>x.id===id);if(!a)return;let cur=a.status;if(cur==="待審核")cur="待輔導老師審核";const i=ACT_STAGES.indexOf(cur);if(i<0)return;
  const hasReq=sumReq(a)>0; /* 有「擬請補助」＝有申請經費 → 三關；無經費 → 輔導老師通過即核准 */
  if(i===0){const ft=$("#fundtext_"+id),fs=$("#fund_"+id);const fund=(ft&&ft.value.trim())||(fs?fs.value:"");if(hasReq&&!fund){toast("請選擇或自行輸入經費來源");return;}a.fund=fund||"自籌／無申請補助";a.schoolApproved=sumApproved(a);
    if(!hasReq){a.status="已核准";a.note="無申請經費，輔導老師審核通過即核准 "+today();audit("核准活動申請（無經費·輔導老師單關）",a.club+"／"+a.name);notifyEmail(a.club+" 活動「"+a.name+"」無申請經費，輔導老師審核通過，直接核准");toast(`#${id} 無申請經費，輔導老師通過即核准`);render();return;}
  }
  if(i<ACT_STAGES.length-1){a.status=ACT_STAGES[i+1];a.note=ACT_STAGES[i]+" 通過 "+today();notifyEmail(a.club+" 活動「"+a.name+"」"+ACT_STAGES[i]+" 通過，進入「"+a.status+"」"+(i===0?"，經費來源："+a.fund:""));toast(`#${id} ${ACT_STAGES[i]} 通過 → ${a.status}`);render();return;}
  a.status="已核准";a.note="三級簽核完成核准 "+today();audit("核准活動申請",a.club+"／"+a.name+"（核定 $"+(a.schoolApproved||0).toLocaleString()+"）");notifyEmail(a.club+" 活動「"+a.name+"」三級簽核完成並核准，核定金額 $"+(a.schoolApproved||0).toLocaleString());toast(`#${id} 已完成三級簽核並核准`);render();}
/* 權限與審核優化新增：經費明細逐項核定（檢視詳情 Modal 內） */
function budgetDetailTable(a){const editable=isActPending(a.status)||a.status==="待審核";const items=budgetList(a);

  return `<h3 style="margin-top:14px">經費明細與核定</h3>
  <div style="overflow:auto"><table class="tb"><thead><tr><th>摘要</th><th>說明</th><th>自籌</th><th>擬請補助</th><th>學校核定</th></tr></thead><tbody>${rows}</tbody>
  <tfoot><tr><td style="text-align:right;font-weight:700">合計</td><td></td><td><b>$${sumSelf(a).toLocaleString()}</b></td><td><b>$${sumReq(a).toLocaleString()}</b></td><td><b id="bapp_total" style="color:var(--blue)">$${sumApproved(a).toLocaleString()}</b></td></tr></tfoot></table></div>

}

function budgetSaveApproved(id){const a=state.activities.find(x=>x.id===id);if(!a)return;$$(".bapp").forEach(i=>{const b=budgetList(a).find(x=>String(x.id)===i.dataset.bid);if(b)b.approved=i.value===""?null:+i.value;});a.schoolApproved=sumApproved(a);notifyEmail(a.club+" 活動「"+a.name+"」逐項核定已儲存，核定總額 $"+sumApproved(a).toLocaleString());toast("已儲存核定金額，核定總額 $"+sumApproved(a).toLocaleString());render();actDetail(id);}

/* 管理端：刪除活動（任一狀態皆可，含結案資料，無法復原） */

/* v6 修改：結案三階層簽核 */
PAGES.admin.aclose=()=>{const acts=state.activities.filter(a=>isClosePending(a.status)||a.status==="結案待審"||a.status==="已結案");
  const rows=acts.length?acts.slice().reverse().map(a=>`<tr><td>#${a.id}</td><td>${esc(a.club)}</td><td><b style="color:var(--blue);cursor:pointer;text-decoration:underline" onclick="closeDataModal(${a.id})">${esc(a.name)}</b><div style="margin-top:3px"><button class="btn ghost xs" onclick="closeDataModal(${a.id})">🔗 檢視結案資料</button></div></td><td>${a.report?`照片:${esc(a.report.photos||a.report.video||'—')}<br>成果報告:已上傳<br>心得:${(a.report.reflections||[]).length}人<br>實到:${esc(a.report.attendActual||'—')}人<br>支出:$${Number(a.report.expense||0).toLocaleString()}`:'—'}</td><td>${actStatusPill(a.status)}</td>
    <td><div class="row-actions">${(isClosePending(a.status)||a.status==="結案待審")?`<button class="btn ok sm" onclick="closePass(${a.id})">通過本關</button><button class="btn warn sm" onclick="closeDecide(${a.id},'退回')">退回</button>`:a.status==="已結案"?'<span class="pill ok">已完成</span>':`<span class="muted" style="font-size:12px">${esc(a.note||'—')}</span>`}<button class="btn warn xs" onclick="adminDeleteActivity(${a.id})">刪除活動</button></div></td></tr>`).join(""):`<tr><td colspan="6" class="muted" style="text-align:center">無待審結案</td></tr>`;
  /* 逾期未結案（已核准但辦理逾 1 個月未結案）：列出並提供解鎖／重新鎖定 */
  const overdue=state.activities.filter(isCloseOverdue);
  const orows=overdue.length?overdue.slice().reverse().map(a=>`<tr><td>#${a.id}</td><td>${esc(a.club)}</td><td><b>${esc(a.name)}</b></td><td>${a.date}</td><td>${closeDeadlineText(a)}</td><td>${a.closeUnlocked?'<span class="pill ok">已解鎖（可結案）</span>':'<span class="pill no">🔒 已鎖定</span>'}</td><td><div class="row-actions">${a.closeUnlocked?`<button class="btn ghost sm" onclick="relockClose(${a.id})">重新鎖定</button>`:`<button class="btn ok sm" onclick="unlockClose(${a.id})">🔓 解鎖結案</button>`}</div></td></tr>`).join(""):`<tr><td colspan="7" class="muted" style="text-align:center">目前無逾期未結案之活動</td></tr>`;
  return `<h1 class="page">結案審核</h1><p class="sub">結案僅需<b>輔導老師單關審核</b>：輔導老師檢核相片／心得／成果（依實際繳交勾選，至少一項）通過後，即計入競賽行政資料分數</p>
  <div class="card" style="overflow:auto"><h2>待審結案</h2><table class="tb"><thead><tr><th>#</th><th>社團</th><th>活動</th><th>結案檢附</th><th>狀態</th><th>處置</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card" style="overflow:auto"><h2>逾期未結案（已鎖定） <span class="tag">${overdue.filter(a=>!a.closeUnlocked).length} 件鎖定中</span></h2>
  <p class="legend" style="margin-top:0">活動辦理逾 ${CLOSE_LOCK_MONTHS} 個月未結案，系統已自動鎖定社團結案功能；管理員可逐筆「解鎖結案」讓社團補結案，或於補件後「重新鎖定」。</p>
  <table class="tb"><thead><tr><th>#</th><th>社團</th><th>活動</th><th>活動日期</th><th>應結案期限</th><th>鎖定狀態</th><th>處置</th></tr></thead><tbody>${orows}</tbody></table></div>`;
};

/* 權限與審核優化新增：輔導老師結案強制檢核（三項皆勾選才能通過） */

function closeDataModal(id){const a=state.activities.find(x=>x.id===id);if(!a)return;const ac=a.report&&a.report.advisorConfirmed;const anyC=ac&&(ac.photos||ac.reflection||ac.result);modal(`<h3>結案資料：${esc(a.club)}－${esc(a.name)} ${anyC?'<span class="pill ok">輔導老師已確認繳交</span>':(ac?'<span class="pill no">輔導老師檢核：未繳交項目以 0 分計</span>':'')}</h3>${closeDataHtml(a)}`);}

PAGES.admin.amaint=()=>{

    return `<tr><td>#${a.id}</td><td>${esc(a.club)}</td><td>${esc(a.loc||a.who)}</td><td style="font-size:12.5px">${esc(a.item||'—')}</td><td>${a.video?`<button class="btn ghost xs" onclick="viewMaintVideo('${esc(a.video)}','${esc(a.loc||a.who)}')">🎬 檢視影片</button>`:'<span class="muted">無</span>'}</td><td>${a.date}</td><td>${applyBadge(a.status)}${a.handleNote?`<div class="muted" style="font-size:11px">${esc(a.handleNote)}</div>`:''}</td><td>${ctl}</td></tr>`;

  <div class="grid g4">
    <div class="card"><div class="kpi"><span class="n">${wait}</span><span class="l">待處理</span></div></div>
    <div class="card"><div class="kpi"><span class="n">${doing}</span><span class="l">處理中</span></div></div>
    <div class="card"><div class="kpi"><span class="n">${done}</span><span class="l">已完成</span></div></div>
    <div class="card"><div class="kpi"><span class="n">${list.length}</span><span class="l">通報總數</span></div></div>
  </div>
  <div class="card" style="overflow:auto"><table class="tb"><thead><tr><th>#</th><th>社團</th><th>維修地點</th><th>維修項目</th><th>影片</th><th>通報日</th><th>進度</th><th>處置</th></tr></thead><tbody>${rows}</tbody></table></div>`;
};
function viewMaintVideo(v,loc){modal(`<h3>維修通報影片</h3><p class="muted" style="margin-top:0">${esc(loc)}</p><div style="background:#0d1320;border-radius:10px;padding:30px;text-align:center;color:#cdd6e2"><div style="font-size:40px">🎬</div><div style="margin-top:8px;font-size:14px">${esc(v)}</div><div class="muted" style="font-size:12px;margin-top:6px">（示範：實際系統將於此播放社團上傳之報修影片）</div></div>`);}
function maintAct(id,status){const a=state.applications.find(x=>x.id===id);if(!a)return;if(status==="已退回"){const r=requireReason("退回原因（必填）：","非屬本處理範圍／資訊不足，請補充說明");if(r===null)return;a.handleNote="退回："+r;}else if(status==="處理中"){const r=prompt("受理說明（預計處理時間／負責單位）：","已轉總務處，預計 3 個工作天內處理");if(r===null)return;a.handleNote="受理："+r;}else if(status==="已完成"){const r=prompt("完成說明：","已修復並確認設施正常");if(r===null)return;a.handleNote="完成："+r;}a.status=status;toast(`#${id} 維修 → ${status}`);render();}

PAGES.admin.aadmins=()=>{ensureAdminAccounts();const su=adminIsSuper();

function ensureAdminAccounts(){const def={u1:"admin_wang",u2:"admin_lee",u3:"admin_chen"};ADMINS.forEach((a,i)=>{if(!a.account)a.account=def[a.id]||("admin_"+(i+1));if(a.password==null)a.password="1234";if(!a.pwHistory)a.pwHistory=[];});}
function toggleSuper(id){if(!adminIsSuper())return;const a=ADMINS.find(x=>x.id===id);a.super=!a.super;audit("切換最高權限",a.name+" → "+(a.super?"最高權限":"一般管理員"));toast(a.name+(a.super?" 已設為最高權限":" 已取消最高權限"));render();}
function addAdmin(){if(!adminIsSuper())return;const n=$("#newAdmin").value.trim(),acct=$("#newAdminAcct")?$("#newAdminAcct").value.trim():"",pw=$("#newAdminPw")?$("#newAdminPw").value.trim():"";if(!n||!acct||!pw){$("#newAdmin_err").classList.add("show");return;}if(ADMINS.some(a=>a.account===acct)){toast("登入帳號已存在");return;}ADMINS.push({id:"u"+Date.now(),name:n,super:false,permissions:[],account:acct,password:pw,pwHistory:[]});toast("已新增管理員："+n+"（帳號 "+acct+"），請點『設定權限』指派可見模組");render();}
function resetAdminPw(id){if(!adminIsSuper())return;const a=ADMINS.find(x=>x.id===id);if(!a)return;const np=prompt("輸入新的臨時密碼（系統不顯示舊密碼）：","Temp"+Math.floor(Math.random()*9000+1000));if(np===null||!np.trim())return;a.pwHistory=a.pwHistory||[];a.pwHistory.unshift(a.password);if(a.pwHistory.length>3)a.pwHistory.pop();a.password=np.trim();toast(a.name+" 密碼已重設（請交付該承辦人並要求其首次登入後更改）");render();}
/* 權限與審核優化新增：權限設定 Modal */
function permModal(uid){if(!adminIsSuper())return;const a=ADMINS.find(x=>x.id===uid);if(!a)return;a.permissions=a.permissions||[];
  const boxes=ADMIN_PERM_ITEMS.map(it=>`<label style="display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:14px;cursor:pointer"><input type="checkbox" class="perm-box" value="${it.k}" ${a.permissions.includes(it.k)?'checked':''}> ${esc(it.t)} <span class="muted" style="font-size:11px;margin-left:auto">${it.k}</span></label>`).join("");
  modal(`<h3>設定可見模組：${esc(a.name)}</h3><p class="muted" style="margin-top:0">勾選此承辦人可於側邊欄看到的後台模組（「總覽」固定開放）。儲存後即時生效。</p><div style="max-height:50vh;overflow:auto;padding:2px">${boxes}</div><div class="row-actions" style="margin-top:12px"><button class="btn ghost sm" onclick="permAll(true)">全選</button><button class="btn ghost sm" onclick="permAll(false)">全不選</button><button class="btn primary" onclick="savePerm('${uid}')">儲存權限</button></div>`);
}
function permAll(v){$$(".perm-box").forEach(c=>c.checked=v);}
function savePerm(uid){const a=ADMINS.find(x=>x.id===uid);if(!a)return;a.permissions=$$(".perm-box").filter(c=>c.checked).map(c=>c.value);audit("設定管理員權限",a.name+"："+(a.permissions.length?a.permissions.join(","):"（無）"));closeModal();toast(a.name+" 可見模組已更新（即時生效）");render();}
function delAdmin(id){if(!adminIsSuper())return;if(ADMINS.length<=1){toast("至少需保留 1 位管理員");return;}const a=ADMINS.find(x=>x.id===id);ADMINS=ADMINS.filter(x=>x.id!==id);if(state.adminUser===id)state.adminUser=ADMINS[0].id;audit("刪除管理員帳號",a.name);toast("已刪除管理員："+a.name);render();}

/* 最佳社團獎：整併「行政資料(40%) + 社團營運(60%)」 */
function opMaxSum(){return OP_RUBRIC.reduce((t,it)=>t+it.max,0);}
/* 某社團某獎項的各評審評分紀錄（預設最佳社團獎；通常 2 位老師） */
function clubScorers(club,award){award=award||'club';return state.scores.filter(s=>s.club===club&&s.award===award);}
function scorerOpPct(s){const max=opMaxSum()||1;const op=OP_KEYS.reduce((a,k)=>a+((s.items&&s.items[k]&&+s.items[k].score)||0),0);return op/max*100;}
/* 評語顯示用評分細項：最佳社團獎用社團營運(OP)；其他獎用該獎項完整 rubric */
function commentRubric(award){return award==='club'?OP_RUBRIC:awardItems(awardById(award));}
function rubricMax(award){return commentRubric(award).reduce((t,it)=>t+it.max,0);}
function scorerTotal(s,award){return commentRubric(award).reduce((t,it)=>t+((s.items&&s.items[it.key]&&+s.items[it.key].score)||0),0);}
/* 評審評語開放：由最高權限管理員逐「社團×獎項」決定是否可檢視 */
function crKey(club,award){return (award||'club')+"|"+club;}
function commentReleased(club,award){return !!(state.commentRelease&&state.commentRelease[crKey(club,award)]);}
function toggleCommentRelease(club,award){if(!adminIsSuper())return;award=award||'club';state.commentRelease=state.commentRelease||{};const k=crKey(club,award);state.commentRelease[k]=!state.commentRelease[k];const an=awardById(award);audit("切換評語開放",(an?an.name:award)+"／"+club+" → "+(state.commentRelease[k]?"開放":"關閉"));notifyEmail(club+" "+(an?an.name:'')+(state.commentRelease[k]?" 評審評語已開放檢視":" 評審評語已關閉檢視"));toast(club+(state.commentRelease[k]?" 已開放社團檢視評語":" 已關閉社團檢視評語"));closeModal();render();}
/* 最高權限：檢視某社團某獎項所有評審評語並切換開放狀態（顯示評審姓名） */
function openClubComments(club,award){if(!adminIsSuper())return;award=award||'club';const an=awardById(award);const ss=clubScorers(club,award);const items=commentRubric(award);const max=rubricMax(award);const rel=commentReleased(club,award);
  let h=`<h3>${esc(club)}　評審評語（${esc(an?an.name:award)}）</h3>
  <div class="note ${rel?'blue':''}">目前狀態：${rel?'<b>已開放</b>社團檢視評語':'<b>未開放</b>社團檢視評語'}　<button class="btn ${rel?'warn':'ok'} sm" onclick="toggleCommentRelease('${esc(club)}','${award}')">${rel?'關閉社團檢視':'開放社團檢視'}</button></div>`;
  if(!ss.length){h+='<p class="muted">此社團於本獎項尚無評審評分。</p>';modal(h);return;}
  ss.forEach((s,idx)=>{h+=`<div class="card" style="margin:0 0 10px;padding:12px"><b>${esc(s.viewerName||('評審'+(idx+1)))}</b>　<span class="pill info">${esc(an?an.name:award)} ${scorerTotal(s,award)}/${max}</span>${hasPresentation(award)?` <span class="pill purple">現場簡報 ${s.present||0}/20</span> <span class="muted" style="font-size:11px">總分 ${scorePct(s).toFixed(1)}（80%＋20%）</span>`:''}
    <div style="overflow:auto"><table class="tb" style="margin-top:8px"><thead><tr><th>評分項目</th><th style="width:70px">分數</th><th>評語</th></tr></thead><tbody>${items.map(it=>{const x=s.items&&s.items[it.key];return `<tr><td>${esc(it.name)}</td><td>${x?esc(x.score):'—'}/${it.max}</td><td style="font-size:12px">${x&&x.comment?esc(x.comment):'—'}</td></tr>`;}).join("")}</tbody></table></div></div>`;});
  modal(h);
}
/* 社團營運分（0–100）：各指派評審 OP 項目得分平均 */
function viewerOpPct(club){const ss=state.scores.filter(s=>s.club===club&&s.award==='club');if(!ss.length)return null;const max=opMaxSum()||1;const avg=ss.reduce((t,s)=>{const op=OP_KEYS.reduce((a,k)=>a+((s.items&&s.items[k]&&+s.items[k].score)||0),0);return t+op/max*100;},0)/ss.length;return avg;}
/* 整併最佳社團獎：行政資料×40% + 社團營運×60%，可由管理員手改最終總分 */
function computeClubFinal(club){const ad=computeAdminScore(club).total;const op=viewerOpPct(club);const autoFinal=(op==null)?null:(ad*0.4+op*0.6);const fo=state.clubFinalOverride&&state.clubFinalOverride[club];const overridden=(fo!=null&&fo!=='');const final=overridden?fo:autoFinal;return {ad,op,autoFinal,final,overridden,nViewers:state.scores.filter(s=>s.club===club&&s.award==='club').length};}
function adminEditClubFinal(club){if(!adminIsSuper())return;const cur=computeClubFinal(club);const def=(cur.final!=null)?(Math.round(cur.final*10)/10):'';const v=prompt(club+"　最佳社團獎『整併總分』手改（0–100，留空＝採系統計算 "+(cur.autoFinal!=null?cur.autoFinal.toFixed(1):'尚無營運評分')+"）：",def);if(v===null)return;state.clubFinalOverride=state.clubFinalOverride||{};const t=v.trim();if(t===''){delete state.clubFinalOverride[club];audit("清除最佳社團獎手改",club+" 回系統計算");toast(club+" 已清除手改，回系統計算");}else{const n=Math.max(0,Math.min(100,+t||0));state.clubFinalOverride[club]=n;audit("手改最佳社團獎整併總分",club+" → "+n);notifyEmail(club+" 最佳社團獎整併總分經管理員手改為 "+n);toast(club+" 整併總分已手改為 "+n);}render();}
/* 其他獎項成績（含現場簡報 80/20）＋管理員逐筆手改 */
function awardScore(club,award){const aw=awardById(award);const ss=state.scores.filter(s=>s.club===club&&s.award===award);const n=ss.length;let autoRubric=null,autoPresent=null,autoTotal=null;
  if(n){if(aw.present){const items=awardItems(aw);const rmax=items.reduce((t,it)=>t+it.max,0)||1;autoRubric=ss.reduce((t,s)=>{const sum=items.reduce((x,it)=>x+((s.items&&s.items[it.key]&&+s.items[it.key].score)||0),0);return t+sum/rmax*100;},0)/n;autoPresent=ss.reduce((t,s)=>t+(+s.present||0),0)/n;autoTotal=autoRubric*0.8+autoPresent;}else{autoTotal=ss.reduce((t,s)=>t+scorePct(s),0)/n;}}
  const ov=state.awardOverride&&state.awardOverride[award+"|"+club];let rubric=autoRubric,present=autoPresent,total=autoTotal,overridden=false;
  if(ov){overridden=true;if(aw.present){if(ov.rubric!=null)rubric=+ov.rubric;if(ov.present!=null)present=+ov.present;total=(rubric==null?0:rubric)*0.8+(present==null?0:present);}else{if(ov.total!=null)total=+ov.total;}}
  return {rubric,present,total,n,overridden,autoRubric,autoPresent,autoTotal};}
function editScoreModal(club,award){if(!adminIsSuper())return;const aw=awardById(award);const sc=awardScore(club,award);const ov=(state.awardOverride&&state.awardOverride[award+"|"+club])||{};
  let body=`<h3>手改成績：${esc(club)} － ${esc(aw.name)}</h3><p class="muted" style="margin-top:0">可手動調整老師評分結果（不確定老師會調哪一項，兩項皆可改）；留空＝採系統計算。儲存後立即生效並記入稽核軌跡。</p>`;
  if(aw.present){body+=`<div class="grid g2">
    <label class="f"><span class="lab">評分表成績（0–100，占 80%）</span><input type="number" min="0" max="100" id="es_rubric" value="${ov.rubric!=null?ov.rubric:''}" placeholder="系統 ${sc.autoRubric==null?'尚無評分':sc.autoRubric.toFixed(1)}"></label>
    <label class="f"><span class="lab">當日簡報成績（0–20，占 20%）</span><input type="number" min="0" max="20" id="es_present" value="${ov.present!=null?ov.present:''}" placeholder="系統 ${sc.autoPresent==null?'尚無':sc.autoPresent.toFixed(1)}"></label>
  </div><div class="note blue" style="font-size:12px">總分＝評分表×80% ＋ 簡報；系統計算總分 ${sc.autoTotal==null?'—':sc.autoTotal.toFixed(1)}</div>`;}
  else{body+=`<label class="f"><span class="lab">總分（0–100）</span><input type="number" min="0" max="100" id="es_total" value="${ov.total!=null?ov.total:''}" placeholder="系統 ${sc.autoTotal==null?'尚無評分':sc.autoTotal.toFixed(1)}"></label>`;}
  body+=`<div class="row-actions" style="margin-top:10px"><button class="btn primary" onclick="saveAwardScore('${esc(club)}','${award}')">儲存</button>${(state.awardOverride&&state.awardOverride[award+"|"+club])?`<button class="btn ghost" onclick="clearAwardScore('${esc(club)}','${award}')">清除手改（回系統）</button>`:''}</div>`;
  modal(body);}
function saveAwardScore(club,award){if(!adminIsSuper())return;const aw=awardById(award);state.awardOverride=state.awardOverride||{};const k=award+"|"+club;const o={};
  if(aw.present){const r=($("#es_rubric")?$("#es_rubric").value:'').trim(),p=($("#es_present")?$("#es_present").value:'').trim();if(r!=='')o.rubric=Math.max(0,Math.min(100,+r));if(p!=='')o.present=Math.max(0,Math.min(20,+p));}
  else{const t=($("#es_total")?$("#es_total").value:'').trim();if(t!=='')o.total=Math.max(0,Math.min(100,+t));}
  if(Object.keys(o).length)state.awardOverride[k]=o;else delete state.awardOverride[k];
  audit("手改競賽成績",aw.name+"／"+club+"："+(Object.keys(o).length?JSON.stringify(o):"清除"));toast(club+" "+aw.name+" 成績已更新");closeModal();render();}
function clearAwardScore(club,award){if(!adminIsSuper())return;const k=award+"|"+club;if(state.awardOverride)delete state.awardOverride[k];const aw=awardById(award);audit("清除競賽成績手改",aw.name+"／"+club);toast(club+" 已清除手改，回系統計算");closeModal();render();}

/* 匯出評分表（格式對齊學務處 Excel：編號／社團名稱／社團性質／各評分項目(配分)／總分／綜合建議） */
function exportScores(){const a=awardById(evalAward);
  const items=(evalAward==='club')?OP_RUBRIC:awardItems(a);
  let clubs=clubsForAward(evalAward);if(!clubs.length)clubs=CLUBS.filter(c=>state.scores.some(s=>s.club===c&&s.award===evalAward));
  const pres=hasPresentation(evalAward);
  const header=["編號","社團名稱","社團性質"].concat(items.map(it=>it.name+"("+it.max+")"),pres?["現場簡報(20)","總分(評分表80%＋簡報20%)","綜合建議"]:["總分","綜合建議"]);
  const lines=["國立臺灣科技大學 115年度 "+a.name+"評分表"+(evalAward==='club'?"（社團營運 60%；行政資料 40% 由系統計分）":(pres?"（評分表項目占 80% ＋ 活動當日現場簡報占 20%）":""))];
  lines.push(header.map(csvCell).join(","));
  const rmax=items.reduce((t,it)=>t+it.max,0);
  clubs.forEach((c,i)=>{
    const ss=state.scores.filter(s=>s.club===c&&s.award===evalAward);
    const itemAvg=it=>{if(!ss.length)return "";const vals=ss.map(s=>(s.items&&s.items[it.key]&&+s.items[it.key].score)||0);return (vals.reduce((x,y)=>x+y,0)/vals.length).toFixed(1);};
    let rubricSum=0;const cells=items.map(it=>{const v=itemAvg(it);if(v!=="")rubricSum+=+v;return v;});
    const comments=ss.map(s=>{const cm=items.map(it=>(s.items&&s.items[it.key]&&s.items[it.key].comment)||"").filter(Boolean);return cm.length?(s.viewerName||"評審")+"："+cm.join("；"):"";}).filter(Boolean).join(" ｜ ");
    const asc=(evalAward!=='club')?awardScore(c,evalAward):null; /* 反映管理員手改 */
    if(pres){lines.push([i+1,c,clubTypeOf(c)].concat(cells,[(asc&&asc.present!=null)?asc.present.toFixed(1):"",(asc&&asc.total!=null)?asc.total.toFixed(1)+(asc.overridden?"(手改)":""):"",comments]).map(csvCell).join(","));}
    else lines.push([i+1,c,clubTypeOf(c)].concat(cells,[(asc&&asc.total!=null)?asc.total.toFixed(1)+(asc.overridden?"(手改)":""):"",comments]).map(csvCell).join(","));
  });
  if(evalAward==='club'){lines.push("");lines.push("整併摘要（行政資料 40% ＋ 社團營運 60%）");lines.push(["社團","行政資料/100","社團營運/100","整併總分","等第","是否手改"].map(csvCell).join(","));clubs.forEach(c=>{const f=computeClubFinal(c);lines.push([c,f.ad.toFixed(1),f.op==null?"":f.op.toFixed(1),f.final==null?"":f.final.toFixed(1),f.final==null?"":gradeOf(f.final),f.overridden?"是":"否"].map(csvCell).join(","));});}
  download(a.name+"_評分表.csv",lines.join("\n"));}

  const confirmed={};items.forEach(id=>{const it=state.signupItems.find(x=>x.id===id);confirmed[id]=(it&&!it.sessionBased&&!it.requiresConfirmation)?true:false;});

/* 政府行事曆假日（示範 2026）；逾期＝活動結束日之隔天上班日 10:30 前未還 */
const GOV_HOLIDAYS=new Set(["2026-01-01","2026-02-16","2026-02-17","2026-02-18","2026-02-19","2026-02-20","2026-02-27","2026-02-28","2026-04-03","2026-04-04","2026-04-05","2026-05-01","2026-06-19","2026-09-25","2026-10-09","2026-10-10"]);
function fmtKey(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
function isWorkday(d){const day=d.getDay();if(day===0||day===6)return false;return !GOV_HOLIDAYS.has(fmtKey(d));}
function nextWorkday(d){const x=new Date(d);do{x.setDate(x.getDate()+1);}while(!isWorkday(x));return x;}
function dueDeadline(endStr){const end=new Date(endStr.replace(/\//g,"-")+"T00:00:00");const nd=nextWorkday(end);nd.setHours(10,30,0,0);return nd;}
const WDAY=["日","一","二","三","四","五","六"];
function dueText(endStr){if(!endStr)return "—";const dl=dueDeadline(endStr);return fmtKey(dl).replace(/-/g,"/")+"（"+WDAY[dl.getDay()]+"）10:30";}
function isOverdueNow(endStr){if(!endStr)return false;return new Date()>dueDeadline(endStr);}

function addMonthStr(){const d=new Date();d.setMonth(d.getMonth()+1);return fmtKey(d).replace(/-/g,"/");}
function suspendClub(c,reason,until){const m=clubMeta(c);m.suspended=true;m.reason=reason;m.until=until||addMonthStr();}
function unsuspendClub(c){const m=clubMeta(c);m.suspended=false;m.until=null;m.reason="";}
function registerOverdue(c){const m=clubMeta(c);m.overdue=(m.overdue||0)+1;if(m.overdue>=3&&!m.suspended){suspendClub(c,"逾期累計達 3 次（系統自動停權一個月）",addMonthStr());return true;}return false;}
