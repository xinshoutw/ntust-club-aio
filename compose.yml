# club-aio 服務組成
# 開發:docker compose up -d db(前後端在本機熱重載)
# 正式:設定 BACKEND_IMAGE/WEB_IMAGE 後 docker compose pull && docker compose up -d --no-build
#       (映像由 CI 產出,VM 上永不 build)
name: club-aio

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-club}
      # 必填:cp .env.example .env 後設定(避免帶著預設密碼啟動)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-club_aio}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # postgres:18 映像的掛載點是 /var/lib/postgresql(非舊版的 .../data)
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-club} -d ${POSTGRES_DB:-club_aio}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    image: ${BACKEND_IMAGE:-club-aio-backend:local}
    env_file:
      - path: .env
        required: false
    environment:
      # 分離欄位交給後端 URL.create 組合,密碼含特殊字元也安全
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-club}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?請在 .env 設定 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-club_aio}
      UPLOAD_DIR: /srv/uploads
    volumes:
      - uploads:/srv/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    image: ${WEB_IMAGE:-club-aio-web:local}
    ports:
      # 上線切換:edge upstream 必須指到 <VM 內網 IP>:${WEB_PORT}(edge 預設打 80,別漏掉埠號)
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
